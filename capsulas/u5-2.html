<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>¿Qué pieza le falta?</title><style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --fondo:#0b1120; --superficie:#141c2e; --superficie-alta:#1b2438;
  --borde:#2b3650; --acento:#f2c314; --bien:#35b26b; --mal:#ef4444; --abierto:#60a5fa;
  --texto:#e8ecf4; --tenue:#96a0b8;
  --tipo:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;
}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--tipo);
  line-height:1.55;-webkit-font-smoothing:antialiased}
.rail{display:flex;gap:4px;padding:14px 20px 0;max-width:840px;margin:0 auto}
.rail span{flex:1;height:3px;border-radius:2px;background:var(--borde);transition:background .25s}
.rail span.hecho{background:var(--acento)}
.rail span.actual{background:var(--texto)}
.envoltura{max-width:840px;margin:0 auto;padding:20px 20px 56px}
header{padding:18px 0 8px;border-bottom:1px solid var(--borde);margin-bottom:24px}
h1{margin:0;font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:700;color:var(--acento);text-wrap:balance}
.entrada{margin:8px 0 0;color:var(--tenue);font-size:.95rem;max-width:62ch}
.contador{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tenue);
  font-variant-numeric:tabular-nums;margin-bottom:12px}
.caso{background:var(--superficie);border:1px solid var(--borde);border-radius:12px;padding:20px 22px}
.enunciado{margin:0;font-size:1.06rem;max-width:64ch}
.enunciado em{color:var(--acento);font-style:normal;font-weight:600}
.pregunta{margin:18px 0 0;font-weight:600;color:var(--texto);font-size:.98rem}
.opciones{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opcion{display:block;width:100%;text-align:left;font:inherit;font-size:.96rem;color:var(--texto);
  background:var(--superficie-alta);border:1px solid var(--borde);border-left:4px solid var(--borde);
  border-radius:9px;padding:13px 15px;cursor:pointer;transition:border-color .18s,background .18s}
.opcion:hover:not(:disabled){border-color:var(--acento)}
.opcion:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.opcion:disabled{cursor:default;opacity:.55}
.opcion.elegida{opacity:1;background:#1f2a42}
.opcion.elegida[data-tipo=bien]{border-left-color:var(--bien)}
.opcion.elegida[data-tipo=mal]{border-left-color:var(--mal)}
.opcion.elegida[data-tipo=abierto]{border-left-color:var(--abierto)}
.porque{margin:10px 0 0;padding:13px 15px;border-radius:9px;font-size:.93rem;
  background:#101a2e;border:1px solid var(--borde);border-left:4px solid var(--tenue);max-width:66ch}
.porque[data-tipo=bien]{border-left-color:var(--bien)}
.porque[data-tipo=mal]{border-left-color:var(--mal)}
.porque[data-tipo=abierto]{border-left-color:var(--abierto)}
.marca{display:block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:5px;color:var(--tenue)}
.porque[data-tipo=bien] .marca{color:var(--bien)}
.porque[data-tipo=mal] .marca{color:var(--mal)}
.porque[data-tipo=abierto] .marca{color:var(--abierto)}
.nota{margin:14px 0 0;font-size:.86rem;color:var(--tenue);border-left:2px solid var(--borde);padding-left:12px}
.pie{display:flex;justify-content:flex-end;margin-top:18px}
.siguiente{font:inherit;font-size:.95rem;font-weight:600;color:#0b1120;background:var(--acento);
  border:0;border-radius:8px;padding:11px 22px;cursor:pointer}
.siguiente:focus-visible{outline:2px solid var(--texto);outline-offset:2px}
.siguiente[hidden]{display:none}
.cierre h2{margin:0 0 10px;font-size:1.3rem;color:var(--acento)}
.cierre p{margin:0 0 12px;max-width:64ch}
.cierre .aviso{margin-top:22px;padding:14px 16px;border-radius:9px;background:#101a2e;
  border:1px solid var(--borde);border-left:4px solid var(--acento);font-size:.93rem}
.reiniciar{margin-top:16px;font:inherit;font-size:.9rem;color:var(--tenue);background:none;
  border:1px solid var(--borde);border-radius:8px;padding:9px 16px;cursor:pointer}
.reiniciar:hover{color:var(--texto);border-color:var(--tenue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.envoltura{padding:14px 14px 44px}.caso{padding:16px}}
</style><div class="rail" id="rail" aria-hidden="true"></div><div class="envoltura"><header><h1>¿Qué pieza le falta?</h1><p class="entrada">Seis consignas casi completas. A cada una le falta una de las cuatro piezas — rol, contexto, producto o destinatario. Encuentre cuál, y vea qué entrega el estudiante sin ella.</p></header><main id="zona"></main></div><script>window.__CAPSULA__={"casos":[{"enunciado":"\u003cem>«Usted es asesor ambiental de una alcaldía pequeña. Le llega este informe de calidad del agua, incompleto. Escriba una recomendación de una página.»\u003c/em>","pregunta":"¿Qué pieza le falta a esta consigna?","opciones":[{"t":"El rol: quién es el estudiante mientras la hace.","tipo":"mal","porque":"Esa pieza sí está. Vuelva a leer la consigna buscando cuál de las cuatro no aparece."},{"t":"El contexto: dónde ocurre y con qué información cuenta.","tipo":"mal","porque":"El contexto está: una alcaldía pequeña y un informe incompleto. Esa incompletitud es justamente parte del contexto."},{"t":"El producto: qué entrega exactamente y de qué tamaño.","tipo":"mal","porque":"Esa pieza sí está. Vuelva a leer la consigna buscando cuál de las cuatro no aparece."},{"t":"El destinatario: para quién lo hace.","tipo":"bien","porque":"Sí: falta para quién. ¿Para el alcalde, que no es del área? ¿Para el equipo técnico? ¿Para la comunidad del barrio? Sin destinatario, el estudiante escribe para el profesor — y escribir para el profesor es lo contrario de lo que se buscaba."}]},{"enunciado":"\u003cem>«Redacte un informe técnico de dos páginas dirigido al comité de obras, explicando por qué la alternativa B es preferible.»\u003c/em>","pregunta":"¿Qué pieza le falta a esta consigna?","opciones":[{"t":"El rol: quién es el estudiante mientras la hace.","tipo":"bien","porque":"Sí: falta quién es el estudiante. ¿El ingeniero que la propuso? ¿Un evaluador externo contratado? ¿Un miembro del comité? El rol cambia qué puede afirmar y qué tiene que justificar."},{"t":"El contexto: dónde ocurre y con qué información cuenta.","tipo":"mal","porque":"Esa pieza sí está. Vuelva a leer la consigna buscando cuál de las cuatro no aparece."},{"t":"El producto: qué entrega exactamente y de qué tamaño.","tipo":"mal","porque":"Esa pieza sí está. Vuelva a leer la consigna buscando cuál de las cuatro no aparece."},{"t":"El destinatario: para quién lo hace.","tipo":"mal","porque":"El destinatario está y es preciso: el comité de obras."}]},{"enunciado":"\u003cem>«Usted es docente de aula. Su rectora le pide una propuesta para mejorar los resultados de lectura del grado quinto.»\u003c/em>","pregunta":"¿Qué pieza le falta a esta consigna?","opciones":[{"t":"El rol: quién es el estudiante mientras la hace.","tipo":"mal","porque":"Esa pieza sí está. Vuelva a leer la consigna buscando cuál de las cuatro no aparece."},{"t":"El contexto: dónde ocurre y con qué información cuenta.","tipo":"abierto","porque":"El contexto está en parte —una escuela, grado quinto, resultados de lectura—, aunque podría ser más rico. Pero lo que falta con claridad es qué se entrega."},{"t":"El producto: qué entrega exactamente y de qué tamaño.","tipo":"bien","porque":"Sí: falta qué entrega. ¿Una página? ¿Un plan de un semestre? ¿Tres ideas priorizadas? Sin producto definido, unos entregan media carilla y otros veinte páginas, y la rúbrica no puede ser justa con ambos."},{"t":"El destinatario: para quién lo hace.","tipo":"mal","porque":"Esa pieza sí está. Vuelva a leer la consigna buscando cuál de las cuatro no aparece."}]},{"enunciado":"\u003cem>«Usted es epidemiólogo de campo. Prepare un informe de una página para la secretaría de salud.»\u003c/em>","pregunta":"¿Qué pieza le falta a esta consigna?","opciones":[{"t":"El rol: quién es el estudiante mientras la hace.","tipo":"mal","porque":"Esa pieza sí está. Vuelva a leer la consigna buscando cuál de las cuatro no aparece."},{"t":"El contexto: dónde ocurre y con qué información cuenta.","tipo":"bien","porque":"Sí: falta el contexto. ¿Sobre qué? ¿Con qué datos? ¿Qué está pasando? Una consigna con rol, producto y destinatario pero sin situación es un molde vacío."},{"t":"El producto: qué entrega exactamente y de qué tamaño.","tipo":"mal","porque":"El producto está: un informe de una página."},{"t":"El destinatario: para quién lo hace.","tipo":"mal","porque":"Esa pieza sí está. Vuelva a leer la consigna buscando cuál de las cuatro no aparece."}]},{"enunciado":"\u003cem>«Analice el caso del anexo y entregue un documento de tres páginas para el equipo directivo.»\u003c/em>","pregunta":"¿Qué pieza le falta a esta consigna?","opciones":[{"t":"El rol: quién es el estudiante mientras la hace.","tipo":"bien","porque":"Sí: falta el rol. Y note el efecto: sin rol, «analice» lo hace el estudiante como estudiante — es decir, demostrando que estudió. Con rol, lo hace como alguien que tiene que responder por su análisis."},{"t":"El contexto: dónde ocurre y con qué información cuenta.","tipo":"mal","porque":"El contexto está en el anexo, que es donde debe estar."},{"t":"El producto: qué entrega exactamente y de qué tamaño.","tipo":"mal","porque":"Esa pieza sí está. Vuelva a leer la consigna buscando cuál de las cuatro no aparece."},{"t":"El destinatario: para quién lo hace.","tipo":"mal","porque":"Esa pieza sí está. Vuelva a leer la consigna buscando cuál de las cuatro no aparece."}]},{"enunciado":"\u003cem>«Usted es la nutricionista del centro de salud. Una madre le pregunta, en la sala de espera y con prisa, si debe quitarle el gluten a su hijo. Responda.»\u003c/em>","pregunta":"¿Qué pieza le falta a esta consigna?","opciones":[{"t":"El rol: quién es el estudiante mientras la hace.","tipo":"mal","porque":"El rol está y es preciso: la nutricionista del centro de salud."},{"t":"El contexto: dónde ocurre y con qué información cuenta.","tipo":"mal","porque":"Esa pieza sí está. Vuelva a leer la consigna buscando cuál de las cuatro no aparece."},{"t":"El producto: qué entrega exactamente y de qué tamaño.","tipo":"bien","porque":"Sí: falta qué entrega. Y aquí es interesante, porque la situación pide una respuesta hablada. \u003cstrong>Salida:\u003c/strong> «escriba, en no más de 120 palabras, exactamente lo que le diría» — se conserva el registro oral y se vuelve evaluable."},{"t":"El destinatario: para quién lo hace.","tipo":"mal","porque":"Esa pieza sí está. Vuelva a leer la consigna buscando cuál de las cuatro no aparece."}],"nota":"Este caso muestra que una situación excelente puede quedar sin evaluar por no decir qué se entrega."}],"cierre":{"titulo":"La que más se olvida","cuerpo":"\u003cp>De las cuatro piezas, la que más se cae es el \u003cstrong>destinatario\u003c/strong> — y es la que más cambia el resultado. Sin destinatario, el estudiante escribe para usted; y escribir para el profesor produce texto que demuestra estudio, no texto que explica.\u003c/p>\u003cp>La segunda que más se cae es el \u003cstrong>producto\u003c/strong>. Sin extensión ni forma definida, la misma consigna produce entregas de media página y de veinte, y ninguna rúbrica es justa con las dos.\u003c/p>\u003cp>Ahora tome su tarea principal y márquele las cuatro piezas. La que no encuentre es la que hay que escribir.\u003c/p>","aviso":"Ya terminó. \u003cstrong>Cierre esta pestaña\u003c/strong> y vuelva a la clase para seguir. La cápsula no guarda nada: puede repetirla cuando quiera."},"etiquetas":{"bien":"Esa era","mal":"Esa sí está","abierto":"También se puede sostener"}};</script><script>
const D = window.__CAPSULA__;
const rail = document.getElementById('rail');
const zona = document.getElementById('zona');
let i = 0;

D.casos.forEach(() => rail.appendChild(document.createElement('span')));

function pintarRail() {
  [...rail.children].forEach((s, k) => {
    s.className = k < i ? 'hecho' : (k === i ? 'actual' : '');
  });
}

function caso() {
  pintarRail();
  const c = D.casos[i];
  zona.innerHTML = '';
  const cont = document.createElement('article');
  cont.className = 'caso';
  cont.innerHTML =
    '<p class="contador">Caso ' + (i + 1) + ' de ' + D.casos.length + '</p>' +
    '<p class="enunciado">' + c.enunciado + '</p>' +
    '<p class="pregunta">' + c.pregunta + '</p>';
  const ul = document.createElement('div');
  ul.className = 'opciones';
  const pie = document.createElement('div');
  pie.className = 'pie';
  const btn = document.createElement('button');
  btn.className = 'siguiente';
  btn.hidden = true;
  btn.textContent = i === D.casos.length - 1 ? 'Ver el cierre' : 'Siguiente caso';
  btn.addEventListener('click', () => { i++; i < D.casos.length ? caso() : cierre(); });
  pie.appendChild(btn);

  c.opciones.forEach((o) => {
    const b = document.createElement('button');
    b.className = 'opcion';
    b.type = 'button';
    b.dataset.tipo = o.tipo;
    b.textContent = o.t;
    b.addEventListener('click', () => {
      [...ul.querySelectorAll('.opcion')].forEach((x) => { x.disabled = true; });
      b.classList.add('elegida');
      const p = document.createElement('div');
      p.className = 'porque';
      p.dataset.tipo = o.tipo;
      p.setAttribute('role', 'status');
      const etiqueta = (D.etiquetas || {})[o.tipo] ||
        (o.tipo === 'bien' ? 'Alcanza' : (o.tipo === 'abierto' ? 'Se puede defender' : 'Se queda corto'));
      p.innerHTML = '<span class="marca">' + etiqueta + '</span>' + o.porque;
      b.insertAdjacentElement('afterend', p);
      if (c.nota) {
        const n = document.createElement('p');
        n.className = 'nota';
        n.innerHTML = c.nota;
        ul.appendChild(n);
      }
      btn.hidden = false;
      btn.focus();
    });
    ul.appendChild(b);
  });

  cont.appendChild(ul);
  cont.appendChild(pie);
  zona.appendChild(cont);
  zona.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function cierre() {
  [...rail.children].forEach((s) => { s.className = 'hecho'; });
  zona.innerHTML = '';
  const c = document.createElement('article');
  c.className = 'caso cierre';
  c.innerHTML = '<h2>' + D.cierre.titulo + '</h2>' + D.cierre.cuerpo +
    '<p class="aviso">' + D.cierre.aviso + '</p>';
  const r = document.createElement('button');
  r.className = 'reiniciar';
  r.type = 'button';
  r.textContent = 'Volver a empezar';
  r.addEventListener('click', () => { i = 0; caso(); });
  c.appendChild(r);
  zona.appendChild(c);
}

caso();
</script></body></html>
