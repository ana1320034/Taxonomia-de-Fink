<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>¿Ejercicio o aplicación?</title><style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --fondo:#0b1120; --superficie:#141c2e; --superficie-alta:#1b2438;
  --borde:#2b3650; --acento:#f2c314; --bien:#35b26b; --mal:#ef4444; --abierto:#60a5fa;
  --texto:#e8ecf4; --tenue:#96a0b8;
  --tipo:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;
}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--tipo);
  line-height:1.55;-webkit-font-smoothing:antialiased}
.rail{display:flex;gap:4px;padding:14px 20px 0;max-width:840px;margin:0 auto}
.rail span{flex:1;height:3px;border-radius:2px;background:var(--borde);transition:background .25s}
.rail span.hecho{background:var(--acento)}
.rail span.actual{background:var(--texto)}
.envoltura{max-width:840px;margin:0 auto;padding:20px 20px 56px}
header{padding:18px 0 8px;border-bottom:1px solid var(--borde);margin-bottom:24px}
h1{margin:0;font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:700;color:var(--acento);text-wrap:balance}
.entrada{margin:8px 0 0;color:var(--tenue);font-size:.95rem;max-width:62ch}
.contador{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tenue);
  font-variant-numeric:tabular-nums;margin-bottom:12px}
.caso{background:var(--superficie);border:1px solid var(--borde);border-radius:12px;padding:20px 22px}
.enunciado{margin:0;font-size:1.06rem;max-width:64ch}
.enunciado em{color:var(--acento);font-style:normal;font-weight:600}
.pregunta{margin:18px 0 0;font-weight:600;color:var(--texto);font-size:.98rem}
.opciones{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opcion{display:block;width:100%;text-align:left;font:inherit;font-size:.96rem;color:var(--texto);
  background:var(--superficie-alta);border:1px solid var(--borde);border-left:4px solid var(--borde);
  border-radius:9px;padding:13px 15px;cursor:pointer;transition:border-color .18s,background .18s}
.opcion:hover:not(:disabled){border-color:var(--acento)}
.opcion:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.opcion:disabled{cursor:default;opacity:.55}
.opcion.elegida{opacity:1;background:#1f2a42}
.opcion.elegida[data-tipo=bien]{border-left-color:var(--bien)}
.opcion.elegida[data-tipo=mal]{border-left-color:var(--mal)}
.opcion.elegida[data-tipo=abierto]{border-left-color:var(--abierto)}
.porque{margin:10px 0 0;padding:13px 15px;border-radius:9px;font-size:.93rem;
  background:#101a2e;border:1px solid var(--borde);border-left:4px solid var(--tenue);max-width:66ch}
.porque[data-tipo=bien]{border-left-color:var(--bien)}
.porque[data-tipo=mal]{border-left-color:var(--mal)}
.porque[data-tipo=abierto]{border-left-color:var(--abierto)}
.marca{display:block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:5px;color:var(--tenue)}
.porque[data-tipo=bien] .marca{color:var(--bien)}
.porque[data-tipo=mal] .marca{color:var(--mal)}
.porque[data-tipo=abierto] .marca{color:var(--abierto)}
.nota{margin:14px 0 0;font-size:.86rem;color:var(--tenue);border-left:2px solid var(--borde);padding-left:12px}
.pie{display:flex;justify-content:flex-end;margin-top:18px}
.siguiente{font:inherit;font-size:.95rem;font-weight:600;color:#0b1120;background:var(--acento);
  border:0;border-radius:8px;padding:11px 22px;cursor:pointer}
.siguiente:focus-visible{outline:2px solid var(--texto);outline-offset:2px}
.siguiente[hidden]{display:none}
.cierre h2{margin:0 0 10px;font-size:1.3rem;color:var(--acento)}
.cierre p{margin:0 0 12px;max-width:64ch}
.cierre .aviso{margin-top:22px;padding:14px 16px;border-radius:9px;background:#101a2e;
  border:1px solid var(--borde);border-left:4px solid var(--acento);font-size:.93rem}
.reiniciar{margin-top:16px;font:inherit;font-size:.9rem;color:var(--tenue);background:none;
  border:1px solid var(--borde);border-radius:8px;padding:9px 16px;cursor:pointer}
.reiniciar:hover{color:var(--texto);border-color:var(--tenue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.envoltura{padding:14px 14px 44px}.caso{padding:16px}}
</style><div class="rail" id="rail" aria-hidden="true"></div><div class="envoltura"><header><h1>¿Ejercicio o aplicación?</h1><p class="entrada">Ocho tareas reales de distintas asignaturas. La pregunta que las separa es una sola: ¿el estudiante sabía de antemano qué herramienta usar?</p></header><main id="zona"></main></div><script>window.__CAPSULA__={"casos":[{"enunciado":"\u003cem>Al final del capítulo sobre regresión lineal: «Con los datos de la tabla 4.2, calcule la recta de regresión e interprete la pendiente.»\u003c/em>","pregunta":"¿Qué es esta tarea?","opciones":[{"t":"Es un ejercicio: el estudiante ya sabe qué herramienta usar.","tipo":"bien","porque":"Sí, ejercicio. Está en el capítulo de regresión, los datos vienen limpios y en una tabla, y no hay ninguna decisión. Se está evaluando si sabe operar el procedimiento — que es legítimo, pero es otra cosa."},{"t":"Es aplicación: tiene que elegir.","tipo":"abierto","porque":"No hay elección posible: la herramienta viene con el capítulo. \u003cstrong>Cambio mínimo:\u003c/strong> ponga la misma tarea entre problemas de todo el curso, sin decir de qué tema es."}]},{"enunciado":"\u003cem>«Un colega le pasa esta base de datos y le pregunta si hay relación entre las dos variables. Decida cómo responderle y hágalo.»\u003c/em>","pregunta":"¿Qué es esta tarea?","opciones":[{"t":"Es un ejercicio: el estudiante ya sabe qué herramienta usar.","tipo":"mal","porque":"Aquí no hay etiqueta: nadie le dijo que fuera regresión. Esa ausencia es exactamente lo que convierte la tarea en aplicación."},{"t":"Es aplicación: tiene que elegir.","tipo":"bien","porque":"Sí, aplicación. No dice qué técnica usar, y decidir cuál corresponde —según el tipo de variable, la distribución, el tamaño— es el trabajo real."}]},{"enunciado":"\u003cem>«Aplique el modelo de análisis de casos visto en clase a la situación del anexo.»\u003c/em>","pregunta":"¿Qué es esta tarea?","opciones":[{"t":"Es un ejercicio: el estudiante ya sabe qué herramienta usar.","tipo":"bien","porque":"Sí. La consigna nombra el modelo: \u003cem>«el visto en clase»\u003c/em>. Lo que se evalúa es si sabe ejecutarlo, no si sabe cuándo corresponde."},{"t":"Es aplicación: tiene que elegir.","tipo":"abierto","porque":"Suena a aplicación por el verbo, pero el verbo engaña. \u003cstrong>Cambio mínimo:\u003c/strong> ofrezca tres modelos y pida que elija y sostenga por qué ese."}]},{"enunciado":"\u003cem>«Diseñe un puente peatonal para cruzar la quebrada que hay detrás de la universidad. Vaya, mídala, y decida qué información le falta.»\u003c/em>","pregunta":"¿Qué es esta tarea?","opciones":[{"t":"Es un ejercicio: el estudiante ya sabe qué herramienta usar.","tipo":"mal","porque":"No hay ninguna herramienta indicada: hay un problema y un lugar. Todo lo demás lo decide él."},{"t":"Es aplicación: tiene que elegir.","tipo":"bien","porque":"Sí, y de la mejor clase. Hay una situación real, información incompleta que el estudiante tiene que detectar, y varias soluciones defendibles. Toca los cuatro cuartos de la aplicación."}]},{"enunciado":"\u003cem>«Traduzca las siguientes diez oraciones al pasado simple.»\u003c/em>","pregunta":"¿Qué es esta tarea?","opciones":[{"t":"Es un ejercicio: el estudiante ya sabe qué herramienta usar.","tipo":"bien","porque":"Sí, ejercicio, y perfectamente útil para automatizar una forma. Lo que no hay que hacer es creer que con esto el estudiante puede usar el pasado simple cuando hable."},{"t":"Es aplicación: tiene que elegir.","tipo":"abierto","porque":"La herramienta viene en el enunciado: \u003cem>pasado simple\u003c/em>. \u003cstrong>Cambio mínimo:\u003c/strong> pida que cuente algo que le pasó y elija él los tiempos verbales."}]},{"enunciado":"\u003cem>«Un paciente llega con estos síntomas y estos antecedentes. Diga qué haría en los primeros quince minutos y por qué en ese orden.»\u003c/em>","pregunta":"¿Qué es esta tarea?","opciones":[{"t":"Es un ejercicio: el estudiante ya sabe qué herramienta usar.","tipo":"mal","porque":"Ningún dato indica qué protocolo aplicar. Eso es lo que el estudiante tiene que decidir."},{"t":"Es aplicación: tiene que elegir.","tipo":"bien","porque":"Sí. No hay diagnóstico dado, hay presión de tiempo y el orden importa: es pensamiento práctico, que es el cuarto de la aplicación que casi nunca se evalúa."}]},{"enunciado":"\u003cem>«Resuelva los problemas 1 a 20 del final del capítulo.»\u003c/em>","pregunta":"¿Qué es esta tarea?","opciones":[{"t":"Es un ejercicio: el estudiante ya sabe qué herramienta usar.","tipo":"bien","porque":"Sí, veinte veces. Y ahí está la oportunidad barata: \u003cstrong>mezcle\u003c/strong>. Los mismos veinte problemas, de temas distintos, sin decir de cuál es cada uno, y la tarea cambia de naturaleza sin costo."},{"t":"Es aplicación: tiene que elegir.","tipo":"mal","porque":"Difícil de sostener: el capítulo es la etiqueta."}]},{"enunciado":"\u003cem>«Lleve el proyecto de la propuesta a la entrega en ocho semanas, con dos puntos de control donde reporte qué tuvo que ajustar.»\u003c/em>","pregunta":"¿Qué es esta tarea?","opciones":[{"t":"Es un ejercicio: el estudiante ya sabe qué herramienta usar.","tipo":"abierto","porque":"No hay herramienta prescrita, y además hay que sostener el trabajo en el tiempo y corregirlo sobre la marcha."},{"t":"Es aplicación: tiene que elegir.","tipo":"bien","porque":"Sí, y es la parte de la aplicación que casi ninguna asignatura declara aunque muchas la exigen: gestionar algo complejo de principio a fin. Los dos puntos de control son lo que la hace evaluable."}],"nota":"De las ocho, cuatro son ejercicios. Ninguno está mal: lo que está mal es llamarlos aplicación."}],"cierre":{"titulo":"La etiqueta es el problema","cuerpo":"\u003cp>Fíjese en los cambios mínimos que aparecieron: \u003cstrong>mezclar los problemas, quitar el nombre del modelo, ofrecer tres opciones, no dar todos los datos\u003c/strong>. Ninguno cuesta más trabajo de calificación. Cuestan trabajo de diseño, una vez.\u003c/p>\u003cp>Y ninguno exige inventar tareas nuevas: son las mismas tareas con la etiqueta quitada.\u003c/p>","aviso":"Ya terminó. \u003cstrong>Cierre esta pestaña\u003c/strong> y vuelva a la clase para seguir. La cápsula no guarda nada: puede repetirla cuando quiera."},"etiquetas":{"bien":"Bien visto","mal":"Mírelo otra vez","abierto":"Se puede defender"}};</script><script>
const D = window.__CAPSULA__;
const rail = document.getElementById('rail');
const zona = document.getElementById('zona');
let i = 0;

D.casos.forEach(() => rail.appendChild(document.createElement('span')));

function pintarRail() {
  [...rail.children].forEach((s, k) => {
    s.className = k < i ? 'hecho' : (k === i ? 'actual' : '');
  });
}

function caso() {
  pintarRail();
  const c = D.casos[i];
  zona.innerHTML = '';
  const cont = document.createElement('article');
  cont.className = 'caso';
  cont.innerHTML =
    '<p class="contador">Caso ' + (i + 1) + ' de ' + D.casos.length + '</p>' +
    '<p class="enunciado">' + c.enunciado + '</p>' +
    '<p class="pregunta">' + c.pregunta + '</p>';
  const ul = document.createElement('div');
  ul.className = 'opciones';
  const pie = document.createElement('div');
  pie.className = 'pie';
  const btn = document.createElement('button');
  btn.className = 'siguiente';
  btn.hidden = true;
  btn.textContent = i === D.casos.length - 1 ? 'Ver el cierre' : 'Siguiente caso';
  btn.addEventListener('click', () => { i++; i < D.casos.length ? caso() : cierre(); });
  pie.appendChild(btn);

  c.opciones.forEach((o) => {
    const b = document.createElement('button');
    b.className = 'opcion';
    b.type = 'button';
    b.dataset.tipo = o.tipo;
    b.textContent = o.t;
    b.addEventListener('click', () => {
      [...ul.querySelectorAll('.opcion')].forEach((x) => { x.disabled = true; });
      b.classList.add('elegida');
      const p = document.createElement('div');
      p.className = 'porque';
      p.dataset.tipo = o.tipo;
      p.setAttribute('role', 'status');
      const etiqueta = (D.etiquetas || {})[o.tipo] ||
        (o.tipo === 'bien' ? 'Alcanza' : (o.tipo === 'abierto' ? 'Se puede defender' : 'Se queda corto'));
      p.innerHTML = '<span class="marca">' + etiqueta + '</span>' + o.porque;
      b.insertAdjacentElement('afterend', p);
      if (c.nota) {
        const n = document.createElement('p');
        n.className = 'nota';
        n.innerHTML = c.nota;
        ul.appendChild(n);
      }
      btn.hidden = false;
      btn.focus();
    });
    ul.appendChild(b);
  });

  cont.appendChild(ul);
  cont.appendChild(pie);
  zona.appendChild(cont);
  zona.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function cierre() {
  [...rail.children].forEach((s) => { s.className = 'hecho'; });
  zona.innerHTML = '';
  const c = document.createElement('article');
  c.className = 'caso cierre';
  c.innerHTML = '<h2>' + D.cierre.titulo + '</h2>' + D.cierre.cuerpo +
    '<p class="aviso">' + D.cierre.aviso + '</p>';
  const r = document.createElement('button');
  r.className = 'reiniciar';
  r.type = 'button';
  r.textContent = 'Volver a empezar';
  r.addEventListener('click', () => { i = 0; caso(); });
  c.appendChild(r);
  zona.appendChild(c);
}

caso();
</script></body></html>
