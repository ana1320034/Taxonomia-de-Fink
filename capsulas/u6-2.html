<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Real, simulado u observado</title><style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --fondo:#0b1120; --superficie:#141c2e; --superficie-alta:#1b2438;
  --borde:#2b3650; --acento:#f2c314; --bien:#35b26b; --mal:#ef4444; --abierto:#60a5fa;
  --texto:#e8ecf4; --tenue:#96a0b8;
  --tipo:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;
}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--tipo);
  line-height:1.55;-webkit-font-smoothing:antialiased}
.rail{display:flex;gap:4px;padding:14px 20px 0;max-width:840px;margin:0 auto}
.rail span{flex:1;height:3px;border-radius:2px;background:var(--borde);transition:background .25s}
.rail span.hecho{background:var(--acento)}
.rail span.actual{background:var(--texto)}
.envoltura{max-width:840px;margin:0 auto;padding:20px 20px 56px}
header{padding:18px 0 8px;border-bottom:1px solid var(--borde);margin-bottom:24px}
h1{margin:0;font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:700;color:var(--acento);text-wrap:balance}
.entrada{margin:8px 0 0;color:var(--tenue);font-size:.95rem;max-width:62ch}
.contador{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tenue);
  font-variant-numeric:tabular-nums;margin-bottom:12px}
.caso{background:var(--superficie);border:1px solid var(--borde);border-radius:12px;padding:20px 22px}
.enunciado{margin:0;font-size:1.06rem;max-width:64ch}
.enunciado em{color:var(--acento);font-style:normal;font-weight:600}
.pregunta{margin:18px 0 0;font-weight:600;color:var(--texto);font-size:.98rem}
.opciones{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opcion{display:block;width:100%;text-align:left;font:inherit;font-size:.96rem;color:var(--texto);
  background:var(--superficie-alta);border:1px solid var(--borde);border-left:4px solid var(--borde);
  border-radius:9px;padding:13px 15px;cursor:pointer;transition:border-color .18s,background .18s}
.opcion:hover:not(:disabled){border-color:var(--acento)}
.opcion:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.opcion:disabled{cursor:default;opacity:.55}
.opcion.elegida{opacity:1;background:#1f2a42}
.opcion.elegida[data-tipo=bien]{border-left-color:var(--bien)}
.opcion.elegida[data-tipo=mal]{border-left-color:var(--mal)}
.opcion.elegida[data-tipo=abierto]{border-left-color:var(--abierto)}
.porque{margin:10px 0 0;padding:13px 15px;border-radius:9px;font-size:.93rem;
  background:#101a2e;border:1px solid var(--borde);border-left:4px solid var(--tenue);max-width:66ch}
.porque[data-tipo=bien]{border-left-color:var(--bien)}
.porque[data-tipo=mal]{border-left-color:var(--mal)}
.porque[data-tipo=abierto]{border-left-color:var(--abierto)}
.marca{display:block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:5px;color:var(--tenue)}
.porque[data-tipo=bien] .marca{color:var(--bien)}
.porque[data-tipo=mal] .marca{color:var(--mal)}
.porque[data-tipo=abierto] .marca{color:var(--abierto)}
.nota{margin:14px 0 0;font-size:.86rem;color:var(--tenue);border-left:2px solid var(--borde);padding-left:12px}
.pie{display:flex;justify-content:flex-end;margin-top:18px}
.siguiente{font:inherit;font-size:.95rem;font-weight:600;color:#0b1120;background:var(--acento);
  border:0;border-radius:8px;padding:11px 22px;cursor:pointer}
.siguiente:focus-visible{outline:2px solid var(--texto);outline-offset:2px}
.siguiente[hidden]{display:none}
.cierre h2{margin:0 0 10px;font-size:1.3rem;color:var(--acento)}
.cierre p{margin:0 0 12px;max-width:64ch}
.cierre .aviso{margin-top:22px;padding:14px 16px;border-radius:9px;background:#101a2e;
  border:1px solid var(--borde);border-left:4px solid var(--acento);font-size:.93rem}
.reiniciar{margin-top:16px;font:inherit;font-size:.9rem;color:var(--tenue);background:none;
  border:1px solid var(--borde);border-radius:8px;padding:9px 16px;cursor:pointer}
.reiniciar:hover{color:var(--texto);border-color:var(--tenue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.envoltura{padding:14px 14px 44px}.caso{padding:16px}}
</style><div class="rail" id="rail" aria-hidden="true"></div><div class="envoltura"><header><h1>Real, simulado u observado</h1><p class="entrada">Seis metas con sus condiciones. Elija la forma de experiencia que conviene — y vea qué se gana y qué se sacrifica en cada elección.</p></header><main id="zona"></main></div><script>window.__CAPSULA__={"casos":[{"enunciado":"\u003cstrong>Meta:\u003c/strong> \u003cem>que sepan hacer una entrevista clínica sin perder el hilo.\u003c/em>\u003cbr>\u003cstrong>Condiciones:\u003c/strong> 40 estudiantes, sin acceso a pacientes hasta el semestre siguiente.","pregunta":"¿Qué forma de experiencia conviene aquí?","opciones":[{"t":"Real: en el terreno, con un caso o un cliente de verdad.","tipo":"mal","porque":"No hay pacientes disponibles. Diseñar contra una condición que no se puede cambiar es el error del módulo 2."},{"t":"Simulado: un caso construido, un laboratorio, un juego de roles.","tipo":"bien","porque":"Sí. Con compañeros haciendo de paciente, y un guion que incluya lo que pasa de verdad: que se vaya por las ramas, que llore, que no responda. La clave es que el caso \u003cstrong>no esté limpio\u003c/strong>."},{"t":"Observado: ver a alguien hacerlo, con una guía de qué mirar.","tipo":"mal","porque":"Compare siempre lo que produce con lo que cuesta, y mire sus condiciones antes de decidir."}]},{"enunciado":"\u003cstrong>Meta:\u003c/strong> \u003cem>que sepan qué se siente y qué se decide en una obra en ejecución.\u003c/em>\u003cbr>\u003cstrong>Condiciones:\u003c/strong> 25 estudiantes, hay una obra a diez cuadras y un egresado dispuesto a recibirlos.","pregunta":"¿Qué forma de experiencia conviene aquí?","opciones":[{"t":"Real: en el terreno, con un caso o un cliente de verdad.","tipo":"bien","porque":"Sí, y aprovéchelo: una obra a diez cuadras y alguien que los reciba es una oportunidad que no siempre está. Lo real, cuando las condiciones lo permiten, no tiene sustituto."},{"t":"Simulado: un caso construido, un laboratorio, un juego de roles.","tipo":"abierto","porque":"Se puede simular, y funcionaría. Pero teniendo la obra al lado, simularla es desperdiciar la mejor condición que tiene ese curso."},{"t":"Observado: ver a alguien hacerlo, con una guía de qué mirar.","tipo":"mal","porque":"Compare siempre lo que produce con lo que cuesta, y mire sus condiciones antes de decidir."}]},{"enunciado":"\u003cstrong>Meta:\u003c/strong> \u003cem>que reconozcan cómo un profesional experimentado decide bajo presión.\u003c/em>\u003cbr>\u003cstrong>Condiciones:\u003c/strong> 120 estudiantes, una sesión semanal.","pregunta":"¿Qué forma de experiencia conviene aquí?","opciones":[{"t":"Real: en el terreno, con un caso o un cliente de verdad.","tipo":"mal","porque":"Con 120 estudiantes no hay manera de que todos acompañen a un profesional. La condición manda."},{"t":"Simulado: un caso construido, un laboratorio, un juego de roles.","tipo":"mal","porque":"Compare siempre lo que produce con lo que cuesta, y mire sus condiciones antes de decidir."},{"t":"Observado: ver a alguien hacerlo, con una guía de qué mirar.","tipo":"bien","porque":"Sí, y es la opción subestimada. Una grabación de diez minutos de alguien decidiendo de verdad, con tres preguntas antes de verla, produce mucho más de lo que parece — y funciona igual con 120 que con 12."}]},{"enunciado":"\u003cstrong>Meta:\u003c/strong> \u003cem>que sepan resolver un problema técnico con información incompleta.\u003c/em>\u003cbr>\u003cstrong>Condiciones:\u003c/strong> 60 estudiantes, salón corriente, dos horas semanales.","pregunta":"¿Qué forma de experiencia conviene aquí?","opciones":[{"t":"Real: en el terreno, con un caso o un cliente de verdad.","tipo":"mal","porque":"Compare siempre lo que produce con lo que cuesta, y mire sus condiciones antes de decidir."},{"t":"Simulado: un caso construido, un laboratorio, un juego de roles.","tipo":"bien","porque":"Sí, y no hace falta laboratorio: un caso proyectado, cinco minutos para decidir individualmente, comparación a mano alzada y discusión de las dos opciones más votadas. Cabe en cualquier salón."},{"t":"Observado: ver a alguien hacerlo, con una guía de qué mirar.","tipo":"mal","porque":"Ver a alguien resolverlo enseña menos que resolverlo. Aquí el estudiante puede hacer, y hacer es mejor."}]},{"enunciado":"\u003cstrong>Meta:\u003c/strong> \u003cem>que aprendan a trabajar con alguien que piensa distinto.\u003c/em>\u003cbr>\u003cstrong>Condiciones:\u003c/strong> curso virtual asincrónico, 45 estudiantes que nunca coinciden.","pregunta":"¿Qué forma de experiencia conviene aquí?","opciones":[{"t":"Real: en el terreno, con un caso o un cliente de verdad.","tipo":"mal","porque":"Lo real aquí sería un trabajo con personas de verdad discrepando — y sin ningún momento en común, no hay dónde ocurra."},{"t":"Simulado: un caso construido, un laboratorio, un juego de roles.","tipo":"bien","porque":"Sí, y en asincrónico se simula por escrito: parejas asignadas \u003cstrong>por posición opuesta\u003c/strong> sobre un caso, con la obligación de responder al argumento del otro antes de concluir. El desacuerdo hay que fabricarlo, porque solo no aparece."},{"t":"Observado: ver a alguien hacerlo, con una guía de qué mirar.","tipo":"mal","porque":"Compare siempre lo que produce con lo que cuesta, y mire sus condiciones antes de decidir."}]},{"enunciado":"\u003cstrong>Meta:\u003c/strong> \u003cem>que sepan calibrar el instrumental antes de medir.\u003c/em>\u003cbr>\u003cstrong>Condiciones:\u003c/strong> 30 estudiantes, un solo equipo disponible, tres horas de laboratorio.","pregunta":"¿Qué forma de experiencia conviene aquí?","opciones":[{"t":"Real: en el terreno, con un caso o un cliente de verdad.","tipo":"abierto","porque":"Es lo real, sí, pero con un equipo y treinta estudiantes en tres horas, cada uno tocaría el instrumento seis minutos. La condición decide la secuencia."},{"t":"Simulado: un caso construido, un laboratorio, un juego de roles.","tipo":"mal","porque":"Compare siempre lo que produce con lo que cuesta, y mire sus condiciones antes de decidir."},{"t":"Observado: ver a alguien hacerlo, con una guía de qué mirar.","tipo":"bien","porque":"Sí — pero como \u003cstrong>primer escalón\u003c/strong>: con un equipo y treinta personas, la demostración guiada asegura que todos vean el procedimiento antes de que seis lo toquen. Luego se rota. Observar aquí no reemplaza hacer: lo prepara."}],"nota":"Este caso muestra que las tres formas no compiten: se encadenan."}],"cierre":{"titulo":"Lo simulado es lo más rentable","cuerpo":"\u003cp>De los seis casos, \u003cstrong>tres se resuelven simulando\u003c/strong>. No porque lo real sea peor —no lo es— sino porque casi nunca está disponible, y lo simulado entrega casi todo el rendimiento a una fracción del costo.\u003c/p>\u003cp>Cuando lo simulado falla, la razón es casi siempre la misma: \u003cstrong>el caso está demasiado limpio\u003c/strong>. En la realidad falta información, hay presión de tiempo y la gente no colabora. Un caso sin nada de eso es un ejercicio con decorado.\u003c/p>\u003cp>Y el último caso enseña lo que faltaba: las tres formas no compiten. Se encadenan.\u003c/p>","aviso":"Ya terminó. \u003cstrong>Cierre esta pestaña\u003c/strong> y vuelva a la clase para seguir. La cápsula no guarda nada: puede repetirla cuando quiera."},"etiquetas":{"bien":"Conviene esa","mal":"No es la mejor aquí","abierto":"También se sostiene"}};</script><script>
const D = window.__CAPSULA__;
const rail = document.getElementById('rail');
const zona = document.getElementById('zona');
let i = 0;

D.casos.forEach(() => rail.appendChild(document.createElement('span')));

function pintarRail() {
  [...rail.children].forEach((s, k) => {
    s.className = k < i ? 'hecho' : (k === i ? 'actual' : '');
  });
}

function caso() {
  pintarRail();
  const c = D.casos[i];
  zona.innerHTML = '';
  const cont = document.createElement('article');
  cont.className = 'caso';
  cont.innerHTML =
    '<p class="contador">Caso ' + (i + 1) + ' de ' + D.casos.length + '</p>' +
    '<p class="enunciado">' + c.enunciado + '</p>' +
    '<p class="pregunta">' + c.pregunta + '</p>';
  const ul = document.createElement('div');
  ul.className = 'opciones';
  const pie = document.createElement('div');
  pie.className = 'pie';
  const btn = document.createElement('button');
  btn.className = 'siguiente';
  btn.hidden = true;
  btn.textContent = i === D.casos.length - 1 ? 'Ver el cierre' : 'Siguiente caso';
  btn.addEventListener('click', () => { i++; i < D.casos.length ? caso() : cierre(); });
  pie.appendChild(btn);

  c.opciones.forEach((o) => {
    const b = document.createElement('button');
    b.className = 'opcion';
    b.type = 'button';
    b.dataset.tipo = o.tipo;
    b.textContent = o.t;
    b.addEventListener('click', () => {
      [...ul.querySelectorAll('.opcion')].forEach((x) => { x.disabled = true; });
      b.classList.add('elegida');
      const p = document.createElement('div');
      p.className = 'porque';
      p.dataset.tipo = o.tipo;
      p.setAttribute('role', 'status');
      const etiqueta = (D.etiquetas || {})[o.tipo] ||
        (o.tipo === 'bien' ? 'Alcanza' : (o.tipo === 'abierto' ? 'Se puede defender' : 'Se queda corto'));
      p.innerHTML = '<span class="marca">' + etiqueta + '</span>' + o.porque;
      b.insertAdjacentElement('afterend', p);
      if (c.nota) {
        const n = document.createElement('p');
        n.className = 'nota';
        n.innerHTML = c.nota;
        ul.appendChild(n);
      }
      btn.hidden = false;
      btn.focus();
    });
    ul.appendChild(b);
  });

  cont.appendChild(ul);
  cont.appendChild(pie);
  zona.appendChild(cont);
  zona.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function cierre() {
  [...rail.children].forEach((s) => { s.className = 'hecho'; });
  zona.innerHTML = '';
  const c = document.createElement('article');
  c.className = 'caso cierre';
  c.innerHTML = '<h2>' + D.cierre.titulo + '</h2>' + D.cierre.cuerpo +
    '<p class="aviso">' + D.cierre.aviso + '</p>';
  const r = document.createElement('button');
  r.className = 'reiniciar';
  r.type = 'button';
  r.textContent = 'Volver a empezar';
  r.addEventListener('click', () => { i = 0; caso(); });
  c.appendChild(r);
  zona.appendChild(c);
}

caso();
</script></body></html>
