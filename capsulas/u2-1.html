<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>La misma meta, tres cursos</title><style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --fondo:#0b1120; --superficie:#141c2e; --superficie-alta:#1b2438;
  --borde:#2b3650; --acento:#f2c314; --bien:#35b26b; --mal:#ef4444; --abierto:#60a5fa;
  --texto:#e8ecf4; --tenue:#96a0b8;
  --tipo:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;
}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--tipo);
  line-height:1.55;-webkit-font-smoothing:antialiased}
.rail{display:flex;gap:4px;padding:14px 20px 0;max-width:840px;margin:0 auto}
.rail span{flex:1;height:3px;border-radius:2px;background:var(--borde);transition:background .25s}
.rail span.hecho{background:var(--acento)}
.rail span.actual{background:var(--texto)}
.envoltura{max-width:840px;margin:0 auto;padding:20px 20px 56px}
header{padding:18px 0 8px;border-bottom:1px solid var(--borde);margin-bottom:24px}
h1{margin:0;font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:700;color:var(--acento);text-wrap:balance}
.entrada{margin:8px 0 0;color:var(--tenue);font-size:.95rem;max-width:62ch}
.contador{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tenue);
  font-variant-numeric:tabular-nums;margin-bottom:12px}
.caso{background:var(--superficie);border:1px solid var(--borde);border-radius:12px;padding:20px 22px}
.enunciado{margin:0;font-size:1.06rem;max-width:64ch}
.enunciado em{color:var(--acento);font-style:normal;font-weight:600}
.pregunta{margin:18px 0 0;font-weight:600;color:var(--texto);font-size:.98rem}
.opciones{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opcion{display:block;width:100%;text-align:left;font:inherit;font-size:.96rem;color:var(--texto);
  background:var(--superficie-alta);border:1px solid var(--borde);border-left:4px solid var(--borde);
  border-radius:9px;padding:13px 15px;cursor:pointer;transition:border-color .18s,background .18s}
.opcion:hover:not(:disabled){border-color:var(--acento)}
.opcion:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.opcion:disabled{cursor:default;opacity:.55}
.opcion.elegida{opacity:1;background:#1f2a42}
.opcion.elegida[data-tipo=bien]{border-left-color:var(--bien)}
.opcion.elegida[data-tipo=mal]{border-left-color:var(--mal)}
.opcion.elegida[data-tipo=abierto]{border-left-color:var(--abierto)}
.porque{margin:10px 0 0;padding:13px 15px;border-radius:9px;font-size:.93rem;
  background:#101a2e;border:1px solid var(--borde);border-left:4px solid var(--tenue);max-width:66ch}
.porque[data-tipo=bien]{border-left-color:var(--bien)}
.porque[data-tipo=mal]{border-left-color:var(--mal)}
.porque[data-tipo=abierto]{border-left-color:var(--abierto)}
.marca{display:block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:5px;color:var(--tenue)}
.porque[data-tipo=bien] .marca{color:var(--bien)}
.porque[data-tipo=mal] .marca{color:var(--mal)}
.porque[data-tipo=abierto] .marca{color:var(--abierto)}
.nota{margin:14px 0 0;font-size:.86rem;color:var(--tenue);border-left:2px solid var(--borde);padding-left:12px}
.pie{display:flex;justify-content:flex-end;margin-top:18px}
.siguiente{font:inherit;font-size:.95rem;font-weight:600;color:#0b1120;background:var(--acento);
  border:0;border-radius:8px;padding:11px 22px;cursor:pointer}
.siguiente:focus-visible{outline:2px solid var(--texto);outline-offset:2px}
.siguiente[hidden]{display:none}
.cierre h2{margin:0 0 10px;font-size:1.3rem;color:var(--acento)}
.cierre p{margin:0 0 12px;max-width:64ch}
.cierre .aviso{margin-top:22px;padding:14px 16px;border-radius:9px;background:#101a2e;
  border:1px solid var(--borde);border-left:4px solid var(--acento);font-size:.93rem}
.reiniciar{margin-top:16px;font:inherit;font-size:.9rem;color:var(--tenue);background:none;
  border:1px solid var(--borde);border-radius:8px;padding:9px 16px;cursor:pointer}
.reiniciar:hover{color:var(--texto);border-color:var(--tenue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.envoltura{padding:14px 14px 44px}.caso{padding:16px}}
</style><div class="rail" id="rail" aria-hidden="true"></div><div class="envoltura"><header><h1>La misma meta, tres cursos</h1><p class="entrada">Una sola meta de aprendizaje y tres cursos con condiciones distintas. Decida, en cada uno, si la meta se sostiene tal cual, si hay que replantearla o si hay que soltarla.</p></header><main id="zona"></main></div><script>window.__CAPSULA__={"casos":[{"enunciado":"\u003cem>«Al terminar, el estudiante lleva un proyecto de ocho semanas de la propuesta a la entrega, ajustando el alcance cuando algo no salga como estaba previsto.»\u003c/em>\u003cbr>\u003cbr>\u003cstrong>Curso A:\u003c/strong> 15 estudiantes, laboratorio propio, dos sesiones semanales de tres horas, usted es la única docente del curso.","pregunta":"¿Qué hace con la meta?","opciones":[{"t":"Se sostiene tal cual.","tipo":"bien","porque":"Sí. Quince estudiantes y seis horas semanales permiten acompañar ocho semanas de proyecto con seguimiento real. Esta meta está escrita para un curso como este."},{"t":"Hay que replantearla.","tipo":"mal","porque":"No hace falta. Cuando las condiciones dan, bajar el alcance por precaución también es un error: se pierde lo que el curso sí podía lograr."},{"t":"Hay que soltarla.","tipo":"mal","porque":"Sería desperdiciar unas condiciones excelentes. Aquí el problema no es el curso."}]},{"enunciado":"\u003cem>«Al terminar, el estudiante lleva un proyecto de ocho semanas de la propuesta a la entrega, ajustando el alcance cuando algo no salga como estaba previsto.»\u003c/em>\u003cbr>\u003cbr>\u003cstrong>Curso B:\u003c/strong> 130 estudiantes en auditorio, una sesión semanal de dos horas, sin monitores ni auxiliares.","pregunta":"¿Qué hace con la meta?","opciones":[{"t":"Se sostiene tal cual.","tipo":"mal","porque":"No. Ciento treinta proyectos con acompañamiento no existen: no hay horas. Si la deja escrita, va a terminar evaluándola con un examen y volviendo al problema del módulo 1."},{"t":"Hay que replantearla.","tipo":"bien","porque":"Sí, y así queda: \u003cem>«lleva un proyecto de tres semanas en equipos de cuatro, con dos puntos de control y una entrega individual de media página sobre qué ajustó»\u003c/em>. Conserva lo esencial —planear, sostener, corregir— a una escala que usted puede leer."},{"t":"Hay que soltarla.","tipo":"abierto","porque":"Es una decisión legítima si usted prefiere concentrarse en otras metas. Pero antes de soltarla, mire la versión replanteada: gestionar un proyecto es de las pocas cosas que un egresado va a hacer todas las semanas de su vida laboral."}]},{"enunciado":"\u003cem>«Al terminar, el estudiante lleva un proyecto de ocho semanas de la propuesta a la entrega, ajustando el alcance cuando algo no salga como estaba previsto.»\u003c/em>\u003cbr>\u003cbr>\u003cstrong>Curso C:\u003c/strong> 60 estudiantes, virtual asincrónico, sin ningún momento en que todos coincidan.","pregunta":"¿Qué hace con la meta?","opciones":[{"t":"Se sostiene tal cual.","tipo":"abierto","porque":"Se puede defender, y es la respuesta que más sorprende: el trabajo asincrónico se parece bastante a como se gestionan los proyectos reales hoy. Pero exige rediseñar los puntos de control, porque no hay una sesión donde revisar avances."},{"t":"Hay que replantearla.","tipo":"bien","porque":"Sí, y el cambio no es de tamaño sino de forma: entregas parciales con fecha, una bitácora donde quede el rastro de las decisiones, y devolución escrita en cada punto. La meta sobrevive; lo que cambia es cómo se ve."},{"t":"Hay que soltarla.","tipo":"mal","porque":"Aquí sí sería un error. Lo asincrónico dificulta la conversación, no la gestión de un proyecto — que es justamente lo que se puede hacer por escrito y con fechas."}],"nota":"Fíjese en que en ninguno de los tres cursos la respuesta fue soltarla sin más."}],"cierre":{"titulo":"La misma meta, tres formas","cuerpo":"\u003cp>La meta no era buena o mala: era \u003cstrong>buena para un curso y no para los otros dos\u003c/strong>. Y en los dos casos difíciles, la salida no fue borrarla sino bajarle el alcance hasta que cupiera.\u003c/p>\u003cp>Esa es la operación que va a repetir todo el curso. Una meta más modesta que ocurre vale más que una ambiciosa que no.\u003c/p>\u003cp>Ahora tome la meta más ambiciosa que tenga escrita y páse la por sus propias condiciones.\u003c/p>","aviso":"Ya terminó. \u003cstrong>Cierre esta pestaña\u003c/strong> y vuelva a la clase para seguir. La cápsula no guarda nada: puede repetirla cuando quiera."},"etiquetas":{"bien":"Así es","mal":"No es la salida","abierto":"Se puede defender"}};</script><script>
const D = window.__CAPSULA__;
const rail = document.getElementById('rail');
const zona = document.getElementById('zona');
let i = 0;

D.casos.forEach(() => rail.appendChild(document.createElement('span')));

function pintarRail() {
  [...rail.children].forEach((s, k) => {
    s.className = k < i ? 'hecho' : (k === i ? 'actual' : '');
  });
}

function caso() {
  pintarRail();
  const c = D.casos[i];
  zona.innerHTML = '';
  const cont = document.createElement('article');
  cont.className = 'caso';
  cont.innerHTML =
    '<p class="contador">Caso ' + (i + 1) + ' de ' + D.casos.length + '</p>' +
    '<p class="enunciado">' + c.enunciado + '</p>' +
    '<p class="pregunta">' + c.pregunta + '</p>';
  const ul = document.createElement('div');
  ul.className = 'opciones';
  const pie = document.createElement('div');
  pie.className = 'pie';
  const btn = document.createElement('button');
  btn.className = 'siguiente';
  btn.hidden = true;
  btn.textContent = i === D.casos.length - 1 ? 'Ver el cierre' : 'Siguiente caso';
  btn.addEventListener('click', () => { i++; i < D.casos.length ? caso() : cierre(); });
  pie.appendChild(btn);

  c.opciones.forEach((o) => {
    const b = document.createElement('button');
    b.className = 'opcion';
    b.type = 'button';
    b.dataset.tipo = o.tipo;
    b.textContent = o.t;
    b.addEventListener('click', () => {
      [...ul.querySelectorAll('.opcion')].forEach((x) => { x.disabled = true; });
      b.classList.add('elegida');
      const p = document.createElement('div');
      p.className = 'porque';
      p.dataset.tipo = o.tipo;
      p.setAttribute('role', 'status');
      const etiqueta = (D.etiquetas || {})[o.tipo] ||
        (o.tipo === 'bien' ? 'Alcanza' : (o.tipo === 'abierto' ? 'Se puede defender' : 'Se queda corto'));
      p.innerHTML = '<span class="marca">' + etiqueta + '</span>' + o.porque;
      b.insertAdjacentElement('afterend', p);
      if (c.nota) {
        const n = document.createElement('p');
        n.className = 'nota';
        n.innerHTML = c.nota;
        ul.appendChild(n);
      }
      btn.hidden = false;
      btn.focus();
    });
    ul.appendChild(b);
  });

  cont.appendChild(ul);
  cont.appendChild(pie);
  zona.appendChild(cont);
  zona.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function cierre() {
  [...rail.children].forEach((s) => { s.className = 'hecho'; });
  zona.innerHTML = '';
  const c = document.createElement('article');
  c.className = 'caso cierre';
  c.innerHTML = '<h2>' + D.cierre.titulo + '</h2>' + D.cierre.cuerpo +
    '<p class="aviso">' + D.cierre.aviso + '</p>';
  const r = document.createElement('button');
  r.className = 'reiniciar';
  r.type = 'button';
  r.textContent = 'Volver a empezar';
  r.addEventListener('click', () => { i = 0; caso(); });
  c.appendChild(r);
  zona.appendChild(c);
}

caso();
</script></body></html>
