<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>¿Esto se puede leer antes?</title><style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --fondo:#0b1120; --superficie:#141c2e; --superficie-alta:#1b2438;
  --borde:#2b3650; --acento:#f2c314; --bien:#35b26b; --mal:#ef4444; --abierto:#60a5fa;
  --texto:#e8ecf4; --tenue:#96a0b8;
  --tipo:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;
}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--tipo);
  line-height:1.55;-webkit-font-smoothing:antialiased}
.rail{display:flex;gap:4px;padding:14px 20px 0;max-width:840px;margin:0 auto}
.rail span{flex:1;height:3px;border-radius:2px;background:var(--borde);transition:background .25s}
.rail span.hecho{background:var(--acento)}
.rail span.actual{background:var(--texto)}
.envoltura{max-width:840px;margin:0 auto;padding:20px 20px 56px}
header{padding:18px 0 8px;border-bottom:1px solid var(--borde);margin-bottom:24px}
h1{margin:0;font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:700;color:var(--acento);text-wrap:balance}
.entrada{margin:8px 0 0;color:var(--tenue);font-size:.95rem;max-width:62ch}
.contador{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tenue);
  font-variant-numeric:tabular-nums;margin-bottom:12px}
.caso{background:var(--superficie);border:1px solid var(--borde);border-radius:12px;padding:20px 22px}
.enunciado{margin:0;font-size:1.06rem;max-width:64ch}
.enunciado em{color:var(--acento);font-style:normal;font-weight:600}
.pregunta{margin:18px 0 0;font-weight:600;color:var(--texto);font-size:.98rem}
.opciones{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opcion{display:block;width:100%;text-align:left;font:inherit;font-size:.96rem;color:var(--texto);
  background:var(--superficie-alta);border:1px solid var(--borde);border-left:4px solid var(--borde);
  border-radius:9px;padding:13px 15px;cursor:pointer;transition:border-color .18s,background .18s}
.opcion:hover:not(:disabled){border-color:var(--acento)}
.opcion:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.opcion:disabled{cursor:default;opacity:.55}
.opcion.elegida{opacity:1;background:#1f2a42}
.opcion.elegida[data-tipo=bien]{border-left-color:var(--bien)}
.opcion.elegida[data-tipo=mal]{border-left-color:var(--mal)}
.opcion.elegida[data-tipo=abierto]{border-left-color:var(--abierto)}
.porque{margin:10px 0 0;padding:13px 15px;border-radius:9px;font-size:.93rem;
  background:#101a2e;border:1px solid var(--borde);border-left:4px solid var(--tenue);max-width:66ch}
.porque[data-tipo=bien]{border-left-color:var(--bien)}
.porque[data-tipo=mal]{border-left-color:var(--mal)}
.porque[data-tipo=abierto]{border-left-color:var(--abierto)}
.marca{display:block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:5px;color:var(--tenue)}
.porque[data-tipo=bien] .marca{color:var(--bien)}
.porque[data-tipo=mal] .marca{color:var(--mal)}
.porque[data-tipo=abierto] .marca{color:var(--abierto)}
.nota{margin:14px 0 0;font-size:.86rem;color:var(--tenue);border-left:2px solid var(--borde);padding-left:12px}
.pie{display:flex;justify-content:flex-end;margin-top:18px}
.siguiente{font:inherit;font-size:.95rem;font-weight:600;color:#0b1120;background:var(--acento);
  border:0;border-radius:8px;padding:11px 22px;cursor:pointer}
.siguiente:focus-visible{outline:2px solid var(--texto);outline-offset:2px}
.siguiente[hidden]{display:none}
.cierre h2{margin:0 0 10px;font-size:1.3rem;color:var(--acento)}
.cierre p{margin:0 0 12px;max-width:64ch}
.cierre .aviso{margin-top:22px;padding:14px 16px;border-radius:9px;background:#101a2e;
  border:1px solid var(--borde);border-left:4px solid var(--acento);font-size:.93rem}
.reiniciar{margin-top:16px;font:inherit;font-size:.9rem;color:var(--tenue);background:none;
  border:1px solid var(--borde);border-radius:8px;padding:9px 16px;cursor:pointer}
.reiniciar:hover{color:var(--texto);border-color:var(--tenue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.envoltura{padding:14px 14px 44px}.caso{padding:16px}}
</style><div class="rail" id="rail" aria-hidden="true"></div><div class="envoltura"><header><h1>¿Esto se puede leer antes?</h1><p class="entrada">Ocho descriptores de rúbrica. La prueba es simple: ¿un estudiante que lo lee antes de trabajar sabe qué tiene que hacer? Los que no pasan vienen reescritos.</p></header><main id="zona"></main></div><script>window.__CAPSULA__={"casos":[{"enunciado":"\u003cem>«Análisis: excelente.»\u003c/em>","pregunta":"¿Este descriptor se puede leer antes?","opciones":[{"t":"Sí: el estudiante puede leerlo antes de trabajar y saber qué hacer.","tipo":"mal","porque":"¿Qué haría un estudiante con esto antes de escribir? Nada: no sabe qué es excelente aquí."},{"t":"No: solo sirve después, para explicar la nota.","tipo":"bien","porque":"Sí, solo sirve después. «Excelente» no describe nada: es una etiqueta de valor. \u003cstrong>Reescrito:\u003c/strong> «identifica los factores y explica cómo uno condiciona a otro, señalando cuál es determinante»."}]},{"enunciado":"\u003cem>«Identifica los factores y explica cómo uno condiciona a otro, señalando cuál es determinante.»\u003c/em>","pregunta":"¿Este descriptor se puede leer antes?","opciones":[{"t":"Sí: el estudiante puede leerlo antes de trabajar y saber qué hacer.","tipo":"bien","porque":"Sí. Describe una operación concreta: identificar, explicar la relación, señalar el determinante. Un estudiante puede leerlo y ponerse a hacerlo."},{"t":"No: solo sirve después, para explicar la nota.","tipo":"mal","porque":"Está descrito lo que hay que hacer, no cómo se va a juzgar. Se puede leer antes perfectamente."}]},{"enunciado":"\u003cem>«Demuestra un dominio profundo de los contenidos.»\u003c/em>","pregunta":"¿Este descriptor se puede leer antes?","opciones":[{"t":"Sí: el estudiante puede leerlo antes de trabajar y saber qué hacer.","tipo":"mal","porque":"Pregúntese qué hace un estudiante para «demostrar dominio profundo». Lo que hace es adivinar."},{"t":"No: solo sirve después, para explicar la nota.","tipo":"bien","porque":"Sí. «Dominio profundo» es la fórmula más común de las rúbricas y no le dice nada a nadie. \u003cstrong>Reescrito:\u003c/strong> «explica la idea con sus palabras y la aplica a un caso que no vimos en clase»."}]},{"enunciado":"\u003cem>«Presenta el trabajo sin errores de ortografía ni de puntuación.»\u003c/em>","pregunta":"¿Este descriptor se puede leer antes?","opciones":[{"t":"Sí: el estudiante puede leerlo antes de trabajar y saber qué hacer.","tipo":"bien","porque":"Sí, se puede leer antes y es perfectamente claro. \u003cstrong>Pero\u003c/strong> hágase la otra pregunta: ¿es una de sus metas? Si no lo es, ese criterio está evaluando algo que nadie se propuso enseñar."},{"t":"No: solo sirve después, para explicar la nota.","tipo":"abierto","porque":"Es claro y accionable. El problema de este descriptor no es que no se pueda leer antes: es que puede no corresponder a ninguna meta."}],"nota":"Este caso trae la segunda pregunta que hay que hacerle a cada criterio: ¿responde a alguna de sus metas?"},{"enunciado":"\u003cem>«Cumple parcialmente con lo solicitado.»\u003c/em>","pregunta":"¿Este descriptor se puede leer antes?","opciones":[{"t":"Sí: el estudiante puede leerlo antes de trabajar y saber qué hacer.","tipo":"mal","porque":"Un estudiante no puede apuntar a «cumplir parcialmente». Solo puede descubrir después que ahí quedó."},{"t":"No: solo sirve después, para explicar la nota.","tipo":"bien","porque":"Sí. «Parcialmente» no dice qué parte ni cuánta. Es el descriptor de relleno del nivel intermedio, y aparece en casi todas las rúbricas. \u003cstrong>Reescrito:\u003c/strong> nombre exactamente qué hay en ese nivel y qué falta respecto del siguiente."}]},{"enunciado":"\u003cem>«Sostiene su decisión con al menos dos razones y responde a la objeción más fuerte en contra.»\u003c/em>","pregunta":"¿Este descriptor se puede leer antes?","opciones":[{"t":"Sí: el estudiante puede leerlo antes de trabajar y saber qué hacer.","tipo":"bien","porque":"Sí, y es un buen descriptor: dice cuántas razones, y añade la parte que hace el trabajo intelectual —responder a la objeción—. Se puede leer antes y se puede juzgar después con el mismo texto."},{"t":"No: solo sirve después, para explicar la nota.","tipo":"mal","porque":"Todo lo que pide está enunciado como acción: sostener, dar razones, responder a la objeción."}]},{"enunciado":"\u003cem>«Se evidencia un alto nivel de compromiso con la problemática abordada.»\u003c/em>","pregunta":"¿Este descriptor se puede leer antes?","opciones":[{"t":"Sí: el estudiante puede leerlo antes de trabajar y saber qué hacer.","tipo":"mal","porque":"Un estudiante que lea esto va a escribir párrafos entusiastas. Está evaluando la actuación, no el pensamiento."},{"t":"No: solo sirve después, para explicar la nota.","tipo":"bien","porque":"Sí, y además es peligroso: premia a quien mejor \u003cem>parezca\u003c/em> comprometido. \u003cstrong>Reescrito:\u003c/strong> «describe en qué cambió su manera de ver el problema, o argumenta por qué no cambió»."}]},{"enunciado":"\u003cem>«Describe la organización de la información en los dos trabajos y señala si hay conexiones entre los elementos.»\u003c/em>","pregunta":"¿Este descriptor se puede leer antes?","opciones":[{"t":"Sí: el estudiante puede leerlo antes de trabajar y saber qué hacer.","tipo":"bien","porque":"Sí. Es largo, y ese es su mérito: la precisión cuesta palabras. Un estudiante sabe exactamente qué se espera y usted sabe exactamente qué buscar."},{"t":"No: solo sirve después, para explicar la nota.","tipo":"mal","porque":"Es una acción descrita con detalle. Se lee antes sin problema."}]}],"cierre":{"titulo":"Dos preguntas por criterio","cuerpo":"\u003cp>La primera ya la practicó: \u003cstrong>¿se puede leer antes?\u003c/strong> Los que fallan son siempre etiquetas de valor —excelente, dominio profundo, parcialmente, alto nivel de compromiso— y todos se arreglan describiendo lo que hay que hacer.\u003c/p>\u003cp>La segunda apareció en el cuarto caso: \u003cstrong>¿este criterio responde a alguna de sus metas?\u003c/strong> Es frecuente descubrir que la rúbrica evalúa ortografía y presentación —que no son metas de nadie— y no evalúa la integración, que sí lo era.\u003c/p>","aviso":"Ya terminó. \u003cstrong>Cierre esta pestaña\u003c/strong> y vuelva a la clase para seguir. La cápsula no guarda nada: puede repetirla cuando quiera."},"etiquetas":{"bien":"Bien visto","mal":"Mírelo otra vez","abierto":"Se puede defender"}};</script><script>
const D = window.__CAPSULA__;
const rail = document.getElementById('rail');
const zona = document.getElementById('zona');
let i = 0;

D.casos.forEach(() => rail.appendChild(document.createElement('span')));

function pintarRail() {
  [...rail.children].forEach((s, k) => {
    s.className = k < i ? 'hecho' : (k === i ? 'actual' : '');
  });
}

function caso() {
  pintarRail();
  const c = D.casos[i];
  zona.innerHTML = '';
  const cont = document.createElement('article');
  cont.className = 'caso';
  cont.innerHTML =
    '<p class="contador">Caso ' + (i + 1) + ' de ' + D.casos.length + '</p>' +
    '<p class="enunciado">' + c.enunciado + '</p>' +
    '<p class="pregunta">' + c.pregunta + '</p>';
  const ul = document.createElement('div');
  ul.className = 'opciones';
  const pie = document.createElement('div');
  pie.className = 'pie';
  const btn = document.createElement('button');
  btn.className = 'siguiente';
  btn.hidden = true;
  btn.textContent = i === D.casos.length - 1 ? 'Ver el cierre' : 'Siguiente caso';
  btn.addEventListener('click', () => { i++; i < D.casos.length ? caso() : cierre(); });
  pie.appendChild(btn);

  c.opciones.forEach((o) => {
    const b = document.createElement('button');
    b.className = 'opcion';
    b.type = 'button';
    b.dataset.tipo = o.tipo;
    b.textContent = o.t;
    b.addEventListener('click', () => {
      [...ul.querySelectorAll('.opcion')].forEach((x) => { x.disabled = true; });
      b.classList.add('elegida');
      const p = document.createElement('div');
      p.className = 'porque';
      p.dataset.tipo = o.tipo;
      p.setAttribute('role', 'status');
      const etiqueta = (D.etiquetas || {})[o.tipo] ||
        (o.tipo === 'bien' ? 'Alcanza' : (o.tipo === 'abierto' ? 'Se puede defender' : 'Se queda corto'));
      p.innerHTML = '<span class="marca">' + etiqueta + '</span>' + o.porque;
      b.insertAdjacentElement('afterend', p);
      if (c.nota) {
        const n = document.createElement('p');
        n.className = 'nota';
        n.innerHTML = c.nota;
        ul.appendChild(n);
      }
      btn.hidden = false;
      btn.focus();
    });
    ul.appendChild(b);
  });

  cont.appendChild(ul);
  cont.appendChild(pie);
  zona.appendChild(cont);
  zona.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function cierre() {
  [...rail.children].forEach((s) => { s.className = 'hecho'; });
  zona.innerHTML = '';
  const c = document.createElement('article');
  c.className = 'caso cierre';
  c.innerHTML = '<h2>' + D.cierre.titulo + '</h2>' + D.cierre.cuerpo +
    '<p class="aviso">' + D.cierre.aviso + '</p>';
  const r = document.createElement('button');
  r.className = 'reiniciar';
  r.type = 'button';
  r.textContent = 'Volver a empezar';
  r.addEventListener('click', () => { i = 0; caso(); });
  c.appendChild(r);
  zona.appendChild(c);
}

caso();
</script></body></html>
