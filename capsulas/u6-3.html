<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>La pregunta que produce</title><style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --fondo:#0b1120; --superficie:#141c2e; --superficie-alta:#1b2438;
  --borde:#2b3650; --acento:#f2c314; --bien:#35b26b; --mal:#ef4444; --abierto:#60a5fa;
  --texto:#e8ecf4; --tenue:#96a0b8;
  --tipo:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;
}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--tipo);
  line-height:1.55;-webkit-font-smoothing:antialiased}
.rail{display:flex;gap:4px;padding:14px 20px 0;max-width:840px;margin:0 auto}
.rail span{flex:1;height:3px;border-radius:2px;background:var(--borde);transition:background .25s}
.rail span.hecho{background:var(--acento)}
.rail span.actual{background:var(--texto)}
.envoltura{max-width:840px;margin:0 auto;padding:20px 20px 56px}
header{padding:18px 0 8px;border-bottom:1px solid var(--borde);margin-bottom:24px}
h1{margin:0;font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:700;color:var(--acento);text-wrap:balance}
.entrada{margin:8px 0 0;color:var(--tenue);font-size:.95rem;max-width:62ch}
.contador{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tenue);
  font-variant-numeric:tabular-nums;margin-bottom:12px}
.caso{background:var(--superficie);border:1px solid var(--borde);border-radius:12px;padding:20px 22px}
.enunciado{margin:0;font-size:1.06rem;max-width:64ch}
.enunciado em{color:var(--acento);font-style:normal;font-weight:600}
.pregunta{margin:18px 0 0;font-weight:600;color:var(--texto);font-size:.98rem}
.opciones{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opcion{display:block;width:100%;text-align:left;font:inherit;font-size:.96rem;color:var(--texto);
  background:var(--superficie-alta);border:1px solid var(--borde);border-left:4px solid var(--borde);
  border-radius:9px;padding:13px 15px;cursor:pointer;transition:border-color .18s,background .18s}
.opcion:hover:not(:disabled){border-color:var(--acento)}
.opcion:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.opcion:disabled{cursor:default;opacity:.55}
.opcion.elegida{opacity:1;background:#1f2a42}
.opcion.elegida[data-tipo=bien]{border-left-color:var(--bien)}
.opcion.elegida[data-tipo=mal]{border-left-color:var(--mal)}
.opcion.elegida[data-tipo=abierto]{border-left-color:var(--abierto)}
.porque{margin:10px 0 0;padding:13px 15px;border-radius:9px;font-size:.93rem;
  background:#101a2e;border:1px solid var(--borde);border-left:4px solid var(--tenue);max-width:66ch}
.porque[data-tipo=bien]{border-left-color:var(--bien)}
.porque[data-tipo=mal]{border-left-color:var(--mal)}
.porque[data-tipo=abierto]{border-left-color:var(--abierto)}
.marca{display:block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:5px;color:var(--tenue)}
.porque[data-tipo=bien] .marca{color:var(--bien)}
.porque[data-tipo=mal] .marca{color:var(--mal)}
.porque[data-tipo=abierto] .marca{color:var(--abierto)}
.nota{margin:14px 0 0;font-size:.86rem;color:var(--tenue);border-left:2px solid var(--borde);padding-left:12px}
.pie{display:flex;justify-content:flex-end;margin-top:18px}
.siguiente{font:inherit;font-size:.95rem;font-weight:600;color:#0b1120;background:var(--acento);
  border:0;border-radius:8px;padding:11px 22px;cursor:pointer}
.siguiente:focus-visible{outline:2px solid var(--texto);outline-offset:2px}
.siguiente[hidden]{display:none}
.cierre h2{margin:0 0 10px;font-size:1.3rem;color:var(--acento)}
.cierre p{margin:0 0 12px;max-width:64ch}
.cierre .aviso{margin-top:22px;padding:14px 16px;border-radius:9px;background:#101a2e;
  border:1px solid var(--borde);border-left:4px solid var(--acento);font-size:.93rem}
.reiniciar{margin-top:16px;font:inherit;font-size:.9rem;color:var(--tenue);background:none;
  border:1px solid var(--borde);border-radius:8px;padding:9px 16px;cursor:pointer}
.reiniciar:hover{color:var(--texto);border-color:var(--tenue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.envoltura{padding:14px 14px 44px}.caso{padding:16px}}
</style><div class="rail" id="rail" aria-hidden="true"></div><div class="envoltura"><header><h1>La pregunta que produce</h1><p class="entrada">Ocho preguntas de reflexión. La prueba es imaginar la respuesta típica: si usted puede escribirla sin conocer al estudiante, la pregunta no produce nada. Las que fallan vienen reescritas.</p></header><main id="zona"></main></div><script>window.__CAPSULA__={"casos":[{"enunciado":"\u003cem>«¿Qué aprendió en esta actividad?»\u003c/em>","pregunta":"¿Esta pregunta de reflexión produce algo?","opciones":[{"t":"Produce algo: es concreta y no tiene respuesta conocida de antemano.","tipo":"mal","porque":"Es la pregunta de cierre más usada y la que menos rinde: pide un resumen, y un resumen se improvisa."},{"t":"No produce nada: se responde con una frase amable.","tipo":"bien","porque":"Sí. Respuesta típica: «aprendí mucho sobre el tema y a trabajar en equipo». Usted podría escribirla ahora mismo. \u003cstrong>Reescrita:\u003c/strong> «¿qué creía antes de empezar que ahora sabe que estaba mal?»."}]},{"enunciado":"\u003cem>«¿En qué momento se atascó, y qué hizo?»\u003c/em>","pregunta":"¿Esta pregunta de reflexión produce algo?","opciones":[{"t":"Produce algo: es concreta y no tiene respuesta conocida de antemano.","tipo":"bien","porque":"Sí. Apunta a un momento concreto y a una acción, y no hay una respuesta que quede bien. Además le da a usted información valiosísima: dónde se atascan todos."},{"t":"No produce nada: se responde con una frase amable.","tipo":"mal","porque":"Un estudiante no puede responder esto con una frase amable: tiene que recordar algo específico."}]},{"enunciado":"\u003cem>«¿Le pareció útil la actividad?»\u003c/em>","pregunta":"¿Esta pregunta de reflexión produce algo?","opciones":[{"t":"Produce algo: es concreta y no tiene respuesta conocida de antemano.","tipo":"mal","porque":"Produce una valoración del curso, no aprendizaje del estudiante. Y sesgada, porque la responde delante de quien lo califica."},{"t":"No produce nada: se responde con una frase amable.","tipo":"bien","porque":"Sí, y además es una pregunta cerrada disfrazada de reflexión: la respuesta esperada es «sí». \u003cstrong>Reescrita:\u003c/strong> «¿qué parte de la actividad habría quitado sin perder nada, y por qué?»."}]},{"enunciado":"\u003cem>«¿Qué haría distinto si volviera a empezar este trabajo, y por qué?»\u003c/em>","pregunta":"¿Esta pregunta de reflexión produce algo?","opciones":[{"t":"Produce algo: es concreta y no tiene respuesta conocida de antemano.","tipo":"bien","porque":"Sí, y es de las más rentables: cuesta un renglón y obliga a mirar el propio proceso, no el producto. El «y por qué» es lo que impide la respuesta de compromiso."},{"t":"No produce nada: se responde con una frase amable.","tipo":"mal","porque":"Pide una decisión alternativa y su razón. Eso no se improvisa con una frase amable."}]},{"enunciado":"\u003cem>«Reflexione sobre su desempeño en el trabajo grupal.»\u003c/em>","pregunta":"¿Esta pregunta de reflexión produce algo?","opciones":[{"t":"Produce algo: es concreta y no tiene respuesta conocida de antemano.","tipo":"mal","porque":"Es una consigna, no una pregunta. Y sin un momento específico al que apuntar, el estudiante escribe generalidades."},{"t":"No produce nada: se responde con una frase amable.","tipo":"bien","porque":"Sí. «Reflexione sobre» sin objeto concreto produce párrafos genéricos e intercambiables. \u003cstrong>Reescrita:\u003c/strong> «¿qué hizo cuando el grupo no se puso de acuerdo?»."}]},{"enunciado":"\u003cem>«¿Qué pregunta le quedó dando vueltas?»\u003c/em>","pregunta":"¿Esta pregunta de reflexión produce algo?","opciones":[{"t":"Produce algo: es concreta y no tiene respuesta conocida de antemano.","tipo":"bien","porque":"Sí, y tiene un mérito extra: es de las pocas que se pueden responder honestamente con «ninguna», y esa también es información. Además alimenta directamente el compromiso y el aprender a aprender."},{"t":"No produce nada: se responde con una frase amable.","tipo":"mal","porque":"No hay respuesta que complazca: o hay una pregunta dando vueltas o no la hay."}]},{"enunciado":"\u003cem>«¿Cómo trabajó su equipo?»\u003c/em>","pregunta":"¿Esta pregunta de reflexión produce algo?","opciones":[{"t":"Produce algo: es concreta y no tiene respuesta conocida de antemano.","tipo":"mal","porque":"Pregunta por el equipo en general, así que el estudiante puede responder sin hablar de sí mismo — que es justamente lo que se quería."},{"t":"No produce nada: se responde con una frase amable.","tipo":"bien","porque":"Sí. Respuesta típica: «bien, nos organizamos y cada uno hizo su parte». \u003cstrong>Reescrita:\u003c/strong> «¿qué papel tomó usted, y qué efecto tuvo en los demás?»."}]},{"enunciado":"\u003cem>«¿Qué le sorprendió?»\u003c/em>","pregunta":"¿Esta pregunta de reflexión produce algo?","opciones":[{"t":"Produce algo: es concreta y no tiene respuesta conocida de antemano.","tipo":"bien","porque":"Sí, aunque es corta y suena vaga. Funciona porque la sorpresa es concreta por naturaleza: no se puede fingir en general. Y suele destapar el punto donde una creencia previa se rompió."},{"t":"No produce nada: se responde con una frase amable.","tipo":"abierto","porque":"Es más corta que las otras que funcionan, y por eso puede parecer floja. Pero pruébela: casi nunca produce una frase amable."}],"nota":"Cuatro de las ocho no producen nada — y son las cuatro que más se usan."}],"cierre":{"titulo":"Concretas, sobre un momento, sin respuesta correcta","cuerpo":"\u003cp>Las cuatro que funcionan comparten las tres cosas: \u003cstrong>apuntan a un momento específico, piden una acción o una decisión, y no tienen una respuesta que quede bien\u003c/strong>.\u003c/p>\u003cp>Las cuatro que fallan son las cuatro más usadas: «¿qué aprendió?», «¿le pareció útil?», «reflexione sobre su desempeño», «¿cómo trabajó su equipo?».\u003c/p>\u003cp>Tres preguntas buenas rinden más que una consigna de reflexión libre. Y cuestan lo mismo: un renglón.\u003c/p>","aviso":"Ya terminó. \u003cstrong>Cierre esta pestaña\u003c/strong> y vuelva a la clase para seguir. La cápsula no guarda nada: puede repetirla cuando quiera."},"etiquetas":{"bien":"Bien visto","mal":"Mírelo otra vez","abierto":"Se puede defender"}};</script><script>
const D = window.__CAPSULA__;
const rail = document.getElementById('rail');
const zona = document.getElementById('zona');
let i = 0;

D.casos.forEach(() => rail.appendChild(document.createElement('span')));

function pintarRail() {
  [...rail.children].forEach((s, k) => {
    s.className = k < i ? 'hecho' : (k === i ? 'actual' : '');
  });
}

function caso() {
  pintarRail();
  const c = D.casos[i];
  zona.innerHTML = '';
  const cont = document.createElement('article');
  cont.className = 'caso';
  cont.innerHTML =
    '<p class="contador">Caso ' + (i + 1) + ' de ' + D.casos.length + '</p>' +
    '<p class="enunciado">' + c.enunciado + '</p>' +
    '<p class="pregunta">' + c.pregunta + '</p>';
  const ul = document.createElement('div');
  ul.className = 'opciones';
  const pie = document.createElement('div');
  pie.className = 'pie';
  const btn = document.createElement('button');
  btn.className = 'siguiente';
  btn.hidden = true;
  btn.textContent = i === D.casos.length - 1 ? 'Ver el cierre' : 'Siguiente caso';
  btn.addEventListener('click', () => { i++; i < D.casos.length ? caso() : cierre(); });
  pie.appendChild(btn);

  c.opciones.forEach((o) => {
    const b = document.createElement('button');
    b.className = 'opcion';
    b.type = 'button';
    b.dataset.tipo = o.tipo;
    b.textContent = o.t;
    b.addEventListener('click', () => {
      [...ul.querySelectorAll('.opcion')].forEach((x) => { x.disabled = true; });
      b.classList.add('elegida');
      const p = document.createElement('div');
      p.className = 'porque';
      p.dataset.tipo = o.tipo;
      p.setAttribute('role', 'status');
      const etiqueta = (D.etiquetas || {})[o.tipo] ||
        (o.tipo === 'bien' ? 'Alcanza' : (o.tipo === 'abierto' ? 'Se puede defender' : 'Se queda corto'));
      p.innerHTML = '<span class="marca">' + etiqueta + '</span>' + o.porque;
      b.insertAdjacentElement('afterend', p);
      if (c.nota) {
        const n = document.createElement('p');
        n.className = 'nota';
        n.innerHTML = c.nota;
        ul.appendChild(n);
      }
      btn.hidden = false;
      btn.focus();
    });
    ul.appendChild(b);
  });

  cont.appendChild(ul);
  cont.appendChild(pie);
  zona.appendChild(cont);
  zona.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function cierre() {
  [...rail.children].forEach((s) => { s.className = 'hecho'; });
  zona.innerHTML = '';
  const c = document.createElement('article');
  c.className = 'caso cierre';
  c.innerHTML = '<h2>' + D.cierre.titulo + '</h2>' + D.cierre.cuerpo +
    '<p class="aviso">' + D.cierre.aviso + '</p>';
  const r = document.createElement('button');
  r.className = 'reiniciar';
  r.type = 'button';
  r.textContent = 'Volver a empezar';
  r.addEventListener('click', () => { i = 0; caso(); });
  c.appendChild(r);
  zona.appendChild(c);
}

caso();
</script></body></html>
