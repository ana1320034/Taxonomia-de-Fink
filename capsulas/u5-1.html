<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>¿Hacia dónde mira esta evaluación?</title><style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --fondo:#0b1120; --superficie:#141c2e; --superficie-alta:#1b2438;
  --borde:#2b3650; --acento:#f2c314; --bien:#35b26b; --mal:#ef4444; --abierto:#60a5fa;
  --texto:#e8ecf4; --tenue:#96a0b8;
  --tipo:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;
}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--tipo);
  line-height:1.55;-webkit-font-smoothing:antialiased}
.rail{display:flex;gap:4px;padding:14px 20px 0;max-width:840px;margin:0 auto}
.rail span{flex:1;height:3px;border-radius:2px;background:var(--borde);transition:background .25s}
.rail span.hecho{background:var(--acento)}
.rail span.actual{background:var(--texto)}
.envoltura{max-width:840px;margin:0 auto;padding:20px 20px 56px}
header{padding:18px 0 8px;border-bottom:1px solid var(--borde);margin-bottom:24px}
h1{margin:0;font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:700;color:var(--acento);text-wrap:balance}
.entrada{margin:8px 0 0;color:var(--tenue);font-size:.95rem;max-width:62ch}
.contador{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tenue);
  font-variant-numeric:tabular-nums;margin-bottom:12px}
.caso{background:var(--superficie);border:1px solid var(--borde);border-radius:12px;padding:20px 22px}
.enunciado{margin:0;font-size:1.06rem;max-width:64ch}
.enunciado em{color:var(--acento);font-style:normal;font-weight:600}
.pregunta{margin:18px 0 0;font-weight:600;color:var(--texto);font-size:.98rem}
.opciones{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opcion{display:block;width:100%;text-align:left;font:inherit;font-size:.96rem;color:var(--texto);
  background:var(--superficie-alta);border:1px solid var(--borde);border-left:4px solid var(--borde);
  border-radius:9px;padding:13px 15px;cursor:pointer;transition:border-color .18s,background .18s}
.opcion:hover:not(:disabled){border-color:var(--acento)}
.opcion:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.opcion:disabled{cursor:default;opacity:.55}
.opcion.elegida{opacity:1;background:#1f2a42}
.opcion.elegida[data-tipo=bien]{border-left-color:var(--bien)}
.opcion.elegida[data-tipo=mal]{border-left-color:var(--mal)}
.opcion.elegida[data-tipo=abierto]{border-left-color:var(--abierto)}
.porque{margin:10px 0 0;padding:13px 15px;border-radius:9px;font-size:.93rem;
  background:#101a2e;border:1px solid var(--borde);border-left:4px solid var(--tenue);max-width:66ch}
.porque[data-tipo=bien]{border-left-color:var(--bien)}
.porque[data-tipo=mal]{border-left-color:var(--mal)}
.porque[data-tipo=abierto]{border-left-color:var(--abierto)}
.marca{display:block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:5px;color:var(--tenue)}
.porque[data-tipo=bien] .marca{color:var(--bien)}
.porque[data-tipo=mal] .marca{color:var(--mal)}
.porque[data-tipo=abierto] .marca{color:var(--abierto)}
.nota{margin:14px 0 0;font-size:.86rem;color:var(--tenue);border-left:2px solid var(--borde);padding-left:12px}
.pie{display:flex;justify-content:flex-end;margin-top:18px}
.siguiente{font:inherit;font-size:.95rem;font-weight:600;color:#0b1120;background:var(--acento);
  border:0;border-radius:8px;padding:11px 22px;cursor:pointer}
.siguiente:focus-visible{outline:2px solid var(--texto);outline-offset:2px}
.siguiente[hidden]{display:none}
.cierre h2{margin:0 0 10px;font-size:1.3rem;color:var(--acento)}
.cierre p{margin:0 0 12px;max-width:64ch}
.cierre .aviso{margin-top:22px;padding:14px 16px;border-radius:9px;background:#101a2e;
  border:1px solid var(--borde);border-left:4px solid var(--acento);font-size:.93rem}
.reiniciar{margin-top:16px;font:inherit;font-size:.9rem;color:var(--tenue);background:none;
  border:1px solid var(--borde);border-radius:8px;padding:9px 16px;cursor:pointer}
.reiniciar:hover{color:var(--texto);border-color:var(--tenue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.envoltura{padding:14px 14px 44px}.caso{padding:16px}}
</style><div class="rail" id="rail" aria-hidden="true"></div><div class="envoltura"><header><h1>¿Hacia dónde mira esta evaluación?</h1><p class="entrada">Ocho evaluaciones reales. Decida si miran al pasado del curso o al futuro del estudiante — y cuando miran hacia atrás, la retroalimentación trae el cambio que las gira.</p></header><main id="zona"></main></div><script>window.__CAPSULA__={"casos":[{"enunciado":"\u003cem>«Examen final: cuarenta preguntas de opción múltiple distribuidas proporcionalmente entre las seis unidades.»\u003c/em>","pregunta":"¿Hacia dónde mira esta evaluación?","opciones":[{"t":"Mira hacia atrás: comprueba que pasamos por el contenido.","tipo":"bien","porque":"Sí, y el «distribuidas proporcionalmente» lo delata: la estructura del examen es la del temario, no la de ninguna situación real. \u003cstrong>El cambio no es de contenido:\u003c/strong> es de rol, contexto y destinatario."},{"t":"Mira hacia adelante: se parece a algo que el estudiante va a tener que hacer.","tipo":"mal","porque":"No hay ninguna situación: hay una cobertura del programa."}]},{"enunciado":"\u003cem>«Usted trabaja en la secretaría de salud de su municipio. El alcalde le pide en una página por qué el barrio A tiene peores indicadores que el barrio B, con los mismos servicios. Estos son los datos.»\u003c/em>","pregunta":"¿Hacia dónde mira esta evaluación?","opciones":[{"t":"Mira hacia atrás: comprueba que pasamos por el contenido.","tipo":"mal","porque":"Mire otra vez: hay un rol, un pedido concreto y alguien a quien responderle. Nada de eso aparece en una evaluación que mira hacia atrás."},{"t":"Mira hacia adelante: se parece a algo que el estudiante va a tener que hacer.","tipo":"bien","porque":"Sí. Tiene rol, contexto, producto con extensión y destinatario. Y evalúa exactamente el mismo contenido que un examen de definiciones — solo que ahora hay que usarlo."}]},{"enunciado":"\u003cem>«Ensayo de cinco páginas sobre los principales aportes teóricos vistos en el curso.»\u003c/em>","pregunta":"¿Hacia dónde mira esta evaluación?","opciones":[{"t":"Mira hacia atrás: comprueba que pasamos por el contenido.","tipo":"bien","porque":"Sí. «Los aportes vistos en el curso» es literalmente el pasado del curso. \u003cstrong>Cambio:\u003c/strong> «un colega que no conoce el tema le pregunta cuál de estos aportes le cambiaría el trabajo mañana; respóndale en una página»."},{"t":"Mira hacia adelante: se parece a algo que el estudiante va a tener que hacer.","tipo":"mal","porque":"Escribir cinco páginas es exigente, pero exigente y prospectivo no son lo mismo. Aquí no hay ninguna situación futura."}]},{"enunciado":"\u003cem>«Simulación clínica: recibe un paciente con estos síntomas, veinte minutos, y debe decidir la conducta inicial y justificarla.»\u003c/em>","pregunta":"¿Hacia dónde mira esta evaluación?","opciones":[{"t":"Mira hacia atrás: comprueba que pasamos por el contenido.","tipo":"mal","porque":"Es exactamente el trabajo que va a hacer. Difícil mirar más hacia adelante que esto."},{"t":"Mira hacia adelante: se parece a algo que el estudiante va a tener que hacer.","tipo":"bien","porque":"Sí, y con las cuatro piezas puestas. La presión de tiempo no es un adorno: es parte de la situación que se está simulando."}]},{"enunciado":"\u003cem>«Quiz semanal de cinco preguntas cortas sobre la lectura asignada, con muy poco peso en la nota.»\u003c/em>","pregunta":"¿Hacia dónde mira esta evaluación?","opciones":[{"t":"Mira hacia atrás: comprueba que pasamos por el contenido.","tipo":"bien","porque":"Sí, mira hacia atrás — y está bien que así sea. \u003cstrong>No todo tiene que ser prospectivo:\u003c/strong> comprobar que el conocimiento fundamental está es un trabajo legítimo, siempre que no ocupe el lugar principal."},{"t":"Mira hacia adelante: se parece a algo que el estudiante va a tener que hacer.","tipo":"abierto","porque":"No hay situación futura, y no hace falta que la haya. Este instrumento cumple otra función."}],"nota":"Este caso no es un error del docente: es el uso correcto de un instrumento retrospectivo."},{"enunciado":"\u003cem>«Elabore un plan de intervención para el caso del anexo, siguiendo el formato visto en clase.»\u003c/em>","pregunta":"¿Hacia dónde mira esta evaluación?","opciones":[{"t":"Mira hacia atrás: comprueba que pasamos por el contenido.","tipo":"bien","porque":"Sí, aunque parezca prospectiva. El «siguiendo el formato visto en clase» la ancla al pasado: se evalúa si sabe llenar la plantilla. \u003cstrong>Cambio:\u003c/strong> quite el formato y pida que decida cómo presentarlo según a quién va dirigido."},{"t":"Mira hacia adelante: se parece a algo que el estudiante va a tener que hacer.","tipo":"abierto","porque":"Hay un caso, sí. Pero la consigna dice cómo resolverlo — y en la vida real nadie le va a decir qué formato usar."}],"nota":"El caso más sutil de los ocho: tiene forma de tarea prospectiva y funciona como ejercicio."},{"enunciado":"\u003cem>«Su equipo debe entregar al comité técnico una recomendación sobre cuál de las tres alternativas adoptar, con los criterios que usaron para descartar las otras dos.»\u003c/em>","pregunta":"¿Hacia dónde mira esta evaluación?","opciones":[{"t":"Mira hacia atrás: comprueba que pasamos por el contenido.","tipo":"mal","porque":"No se comprueba ninguna cobertura: se pide una decisión sostenida."},{"t":"Mira hacia adelante: se parece a algo que el estudiante va a tener que hacer.","tipo":"bien","porque":"Sí. Rol (equipo técnico), contexto (tres alternativas reales), producto (una recomendación) y destinatario (un comité). Y lo mejor: pide los criterios de descarte, que es donde se ve el razonamiento."}]},{"enunciado":"\u003cem>«Exposición grupal de veinte minutos sobre el tema asignado a cada equipo.»\u003c/em>","pregunta":"¿Hacia dónde mira esta evaluación?","opciones":[{"t":"Mira hacia atrás: comprueba que pasamos por el contenido.","tipo":"bien","porque":"Sí, y es la evaluación más repetida de la educación superior. Cada equipo cubre un trozo del temario y los demás se aburren. \u003cstrong>Cambio:\u003c/strong> deles todos el mismo caso y pídales que expongan decisiones distintas y las defiendan entre ellos."},{"t":"Mira hacia adelante: se parece a algo que el estudiante va a tener que hacer.","tipo":"mal","porque":"Exponer es una habilidad real, pero «el tema asignado» reparte el temario. Es cobertura con público."}]}],"cierre":{"titulo":"Mismo contenido, otra dirección","cuerpo":"\u003cp>Fíjese en que ninguno de los cambios propuestos \u003cstrong>agrega contenido\u003c/strong>. Todos hacen lo mismo: ponen un rol, una situación, algo que entregar y alguien a quien entregárselo.\u003c/p>\u003cp>Y note el quinto caso: una evaluación que mira hacia atrás no está mal \u003cem>si sabe para qué sirve\u003c/em>. El problema no es que existan; es que ocupen el lugar principal.\u003c/p>\u003cp>El sexto es el que más conviene recordar: tenía forma de tarea prospectiva y funcionaba como ejercicio, porque la consigna decía cómo resolverla.\u003c/p>","aviso":"Ya terminó. \u003cstrong>Cierre esta pestaña\u003c/strong> y vuelva a la clase para seguir. La cápsula no guarda nada: puede repetirla cuando quiera."},"etiquetas":{"bien":"Bien visto","mal":"Mírelo otra vez","abierto":"Se puede defender"}};</script><script>
const D = window.__CAPSULA__;
const rail = document.getElementById('rail');
const zona = document.getElementById('zona');
let i = 0;

D.casos.forEach(() => rail.appendChild(document.createElement('span')));

function pintarRail() {
  [...rail.children].forEach((s, k) => {
    s.className = k < i ? 'hecho' : (k === i ? 'actual' : '');
  });
}

function caso() {
  pintarRail();
  const c = D.casos[i];
  zona.innerHTML = '';
  const cont = document.createElement('article');
  cont.className = 'caso';
  cont.innerHTML =
    '<p class="contador">Caso ' + (i + 1) + ' de ' + D.casos.length + '</p>' +
    '<p class="enunciado">' + c.enunciado + '</p>' +
    '<p class="pregunta">' + c.pregunta + '</p>';
  const ul = document.createElement('div');
  ul.className = 'opciones';
  const pie = document.createElement('div');
  pie.className = 'pie';
  const btn = document.createElement('button');
  btn.className = 'siguiente';
  btn.hidden = true;
  btn.textContent = i === D.casos.length - 1 ? 'Ver el cierre' : 'Siguiente caso';
  btn.addEventListener('click', () => { i++; i < D.casos.length ? caso() : cierre(); });
  pie.appendChild(btn);

  c.opciones.forEach((o) => {
    const b = document.createElement('button');
    b.className = 'opcion';
    b.type = 'button';
    b.dataset.tipo = o.tipo;
    b.textContent = o.t;
    b.addEventListener('click', () => {
      [...ul.querySelectorAll('.opcion')].forEach((x) => { x.disabled = true; });
      b.classList.add('elegida');
      const p = document.createElement('div');
      p.className = 'porque';
      p.dataset.tipo = o.tipo;
      p.setAttribute('role', 'status');
      const etiqueta = (D.etiquetas || {})[o.tipo] ||
        (o.tipo === 'bien' ? 'Alcanza' : (o.tipo === 'abierto' ? 'Se puede defender' : 'Se queda corto'));
      p.innerHTML = '<span class="marca">' + etiqueta + '</span>' + o.porque;
      b.insertAdjacentElement('afterend', p);
      if (c.nota) {
        const n = document.createElement('p');
        n.className = 'nota';
        n.innerHTML = c.nota;
        ul.appendChild(n);
      }
      btn.hidden = false;
      btn.focus();
    });
    ul.appendChild(b);
  });

  cont.appendChild(ul);
  cont.appendChild(pie);
  zona.appendChild(cont);
  zona.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function cierre() {
  [...rail.children].forEach((s) => { s.className = 'hecho'; });
  zona.innerHTML = '';
  const c = document.createElement('article');
  c.className = 'caso cierre';
  c.innerHTML = '<h2>' + D.cierre.titulo + '</h2>' + D.cierre.cuerpo +
    '<p class="aviso">' + D.cierre.aviso + '</p>';
  const r = document.createElement('button');
  r.className = 'reiniciar';
  r.type = 'button';
  r.textContent = 'Volver a empezar';
  r.addEventListener('click', () => { i = 0; caso(); });
  c.appendChild(r);
  zona.appendChild(c);
}

caso();
</script></body></html>
