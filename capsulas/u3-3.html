<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>¿Quién hizo la conexión?</title><style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --fondo:#0b1120; --superficie:#141c2e; --superficie-alta:#1b2438;
  --borde:#2b3650; --acento:#f2c314; --bien:#35b26b; --mal:#ef4444; --abierto:#60a5fa;
  --texto:#e8ecf4; --tenue:#96a0b8;
  --tipo:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;
}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--tipo);
  line-height:1.55;-webkit-font-smoothing:antialiased}
.rail{display:flex;gap:4px;padding:14px 20px 0;max-width:840px;margin:0 auto}
.rail span{flex:1;height:3px;border-radius:2px;background:var(--borde);transition:background .25s}
.rail span.hecho{background:var(--acento)}
.rail span.actual{background:var(--texto)}
.envoltura{max-width:840px;margin:0 auto;padding:20px 20px 56px}
header{padding:18px 0 8px;border-bottom:1px solid var(--borde);margin-bottom:24px}
h1{margin:0;font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:700;color:var(--acento);text-wrap:balance}
.entrada{margin:8px 0 0;color:var(--tenue);font-size:.95rem;max-width:62ch}
.contador{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tenue);
  font-variant-numeric:tabular-nums;margin-bottom:12px}
.caso{background:var(--superficie);border:1px solid var(--borde);border-radius:12px;padding:20px 22px}
.enunciado{margin:0;font-size:1.06rem;max-width:64ch}
.enunciado em{color:var(--acento);font-style:normal;font-weight:600}
.pregunta{margin:18px 0 0;font-weight:600;color:var(--texto);font-size:.98rem}
.opciones{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opcion{display:block;width:100%;text-align:left;font:inherit;font-size:.96rem;color:var(--texto);
  background:var(--superficie-alta);border:1px solid var(--borde);border-left:4px solid var(--borde);
  border-radius:9px;padding:13px 15px;cursor:pointer;transition:border-color .18s,background .18s}
.opcion:hover:not(:disabled){border-color:var(--acento)}
.opcion:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.opcion:disabled{cursor:default;opacity:.55}
.opcion.elegida{opacity:1;background:#1f2a42}
.opcion.elegida[data-tipo=bien]{border-left-color:var(--bien)}
.opcion.elegida[data-tipo=mal]{border-left-color:var(--mal)}
.opcion.elegida[data-tipo=abierto]{border-left-color:var(--abierto)}
.porque{margin:10px 0 0;padding:13px 15px;border-radius:9px;font-size:.93rem;
  background:#101a2e;border:1px solid var(--borde);border-left:4px solid var(--tenue);max-width:66ch}
.porque[data-tipo=bien]{border-left-color:var(--bien)}
.porque[data-tipo=mal]{border-left-color:var(--mal)}
.porque[data-tipo=abierto]{border-left-color:var(--abierto)}
.marca{display:block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:5px;color:var(--tenue)}
.porque[data-tipo=bien] .marca{color:var(--bien)}
.porque[data-tipo=mal] .marca{color:var(--mal)}
.porque[data-tipo=abierto] .marca{color:var(--abierto)}
.nota{margin:14px 0 0;font-size:.86rem;color:var(--tenue);border-left:2px solid var(--borde);padding-left:12px}
.pie{display:flex;justify-content:flex-end;margin-top:18px}
.siguiente{font:inherit;font-size:.95rem;font-weight:600;color:#0b1120;background:var(--acento);
  border:0;border-radius:8px;padding:11px 22px;cursor:pointer}
.siguiente:focus-visible{outline:2px solid var(--texto);outline-offset:2px}
.siguiente[hidden]{display:none}
.cierre h2{margin:0 0 10px;font-size:1.3rem;color:var(--acento)}
.cierre p{margin:0 0 12px;max-width:64ch}
.cierre .aviso{margin-top:22px;padding:14px 16px;border-radius:9px;background:#101a2e;
  border:1px solid var(--borde);border-left:4px solid var(--acento);font-size:.93rem}
.reiniciar{margin-top:16px;font:inherit;font-size:.9rem;color:var(--tenue);background:none;
  border:1px solid var(--borde);border-radius:8px;padding:9px 16px;cursor:pointer}
.reiniciar:hover{color:var(--texto);border-color:var(--tenue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.envoltura{padding:14px 14px 44px}.caso{padding:16px}}
</style><div class="rail" id="rail" aria-hidden="true"></div><div class="envoltura"><header><h1>¿Quién hizo la conexión?</h1><p class="entrada">Ocho situaciones de clase. En todas hay una conexión sobre la mesa. Decida quién la construyó — y cuando la hizo el docente, verá el cambio mínimo que la devuelve al estudiante.</p></header><main id="zona"></main></div><script>window.__CAPSULA__={"casos":[{"enunciado":"\u003cem>«Esto que estamos viendo lo van a necesitar cuando estén trabajando», dice la profesora, y sigue con el tema.\u003c/em>","pregunta":"¿Quién construyó la conexión?","opciones":[{"t":"La hizo el docente: se la contó.","tipo":"bien","porque":"Sí. La conexión se hizo en tres segundos y en voz alta. El estudiante no hizo nada — la oyó como un comentario del profesor. \u003cstrong>Cambio mínimo:\u003c/strong> convertirla en pregunta. «¿En qué momento concreto de su trabajo creen que aparece esto?»"},{"t":"La hizo el estudiante: tuvo que construirla y mostrarla.","tipo":"mal","porque":"El estudiante solo escuchó. Escuchar una conexión no es construirla."}]},{"enunciado":"\u003cem>«Busquen una noticia de esta semana donde aparezca lo que vimos hoy y traigan el enlace con dos líneas explicando dónde está.»\u003c/em>","pregunta":"¿Quién construyó la conexión?","opciones":[{"t":"La hizo el docente: se la contó.","tipo":"mal","porque":"La docente puso la consigna, pero la conexión concreta —esta noticia, este punto— la encuentra el estudiante."},{"t":"La hizo el estudiante: tuvo que construirla y mostrarla.","tipo":"bien","porque":"Sí. Tiene que buscar, reconocer el concepto en un texto que no fue escrito para enseñarlo, y decir dónde está. Las tres cosas son suyas."}]},{"enunciado":"\u003cem>La profesora dedica quince minutos a explicar cómo lo que ven en su materia se relaciona con lo que están viendo en estadística.\u003c/em>","pregunta":"¿Quién construyó la conexión?","opciones":[{"t":"La hizo el docente: se la contó.","tipo":"bien","porque":"Sí, y es un caso interesante porque son quince minutos bien intencionados y bien usados. Pero el puente lo construyó ella entero. \u003cstrong>Cambio mínimo:\u003c/strong> «averigüen qué están viendo ahora en estadística y muéstrenme un punto donde las dos materias se contradigan o se refuercen»."},{"t":"La hizo el estudiante: tuvo que construirla y mostrarla.","tipo":"abierto","porque":"Cuanto más completa es la explicación del docente, menos queda por hacer. Es la paradoja de este tipo de conexión."}]},{"enunciado":"\u003cem>«En el examen final va a haber una pregunta que mezcla el tema de la semana tres con el de la doce.» Y lo cumple.\u003c/em>","pregunta":"¿Quién construyó la conexión?","opciones":[{"t":"La hizo el docente: se la contó.","tipo":"abierto","porque":"La docente anunció que iba a pasar, pero conectar las dos semanas lo hace el estudiante."},{"t":"La hizo el estudiante: tuvo que construirla y mostrarla.","tipo":"bien","porque":"Sí, aunque de manera indirecta: al saber que van a mezclarse, el estudiante tiene que construir el puente para prepararse. Es de las maneras más baratas de forzar la integración hacia adentro."}]},{"enunciado":"\u003cem>La presentación de la profesora tiene una diapositiva titulada «Relación con otras disciplinas», con seis flechas.\u003c/em>","pregunta":"¿Quién construyó la conexión?","opciones":[{"t":"La hizo el docente: se la contó.","tipo":"bien","porque":"Sí. Las seis flechas ya están dibujadas: el estudiante las mira. \u003cstrong>Cambio mínimo:\u003c/strong> muestre la diapositiva con las flechas en blanco y pídales que las llenen."},{"t":"La hizo el estudiante: tuvo que construirla y mostrarla.","tipo":"mal","porque":"Ver un esquema de relaciones no es establecerlas."}]},{"enunciado":"\u003cem>«Traigan un caso de su municipio donde ocurra el fenómeno que estudiamos, y expliquen qué cambia respecto del ejemplo del libro.»\u003c/em>","pregunta":"¿Quién construyó la conexión?","opciones":[{"t":"La hizo el docente: se la contó.","tipo":"mal","porque":"El docente puso el marco; el caso, la búsqueda y la diferencia son del estudiante."},{"t":"La hizo el estudiante: tuvo que construirla y mostrarla.","tipo":"bien","porque":"Sí, y es la mejor versión: el caso es local, así que no se puede resolver con una frase genérica, y la comparación con el libro obliga a mirar los dos con cuidado."}]},{"enunciado":"\u003cem>«Como ya saben de la materia anterior, esto funciona igual que aquello.» Y continúa.\u003c/em>","pregunta":"¿Quién construyó la conexión?","opciones":[{"t":"La hizo el docente: se la contó.","tipo":"bien","porque":"Sí, y con un agravante: da por supuesto que lo recuerdan. \u003cstrong>Cambio mínimo:\u003c/strong> «¿esto en qué se parece a algo que ya vieron? Piénselo un minuto y me dicen»."},{"t":"La hizo el estudiante: tuvo que construirla y mostrarla.","tipo":"mal","porque":"Ni siquiera construyó nada: se le informó que existía un parecido."}]},{"enunciado":"\u003cem>El trabajo final pide integrar los contenidos del curso en un solo producto, y la rúbrica valora que las partes se sostengan entre sí.\u003c/em>","pregunta":"¿Quién construyó la conexión?","opciones":[{"t":"La hizo el docente: se la contó.","tipo":"mal","porque":"La consigna es del docente, pero el producto integrado lo arma el estudiante — y la rúbrica se lo exige."},{"t":"La hizo el estudiante: tuvo que construirla y mostrarla.","tipo":"bien","porque":"Sí, y la rúbrica es lo que lo hace real: sin un criterio que valore la integración, el trabajo final termina siendo cinco trabajos pegados."}],"nota":"De las ocho, cuatro las hace el docente. Y en las cuatro, el cambio cuesta una frase."}],"cierre":{"titulo":"De afirmación a pregunta","cuerpo":"\u003cp>Mire los cuatro cambios mínimos que aparecieron. Los cuatro son la misma operación: \u003cstrong>convertir una afirmación del docente en una pregunta al estudiante\u003c/strong>, o pedir la evidencia de una conexión en vez de nombrarla.\u003c/p>\u003cp>Ninguno exige más tiempo de clase. Uno de ellos —la diapositiva con las flechas en blanco— es literalmente la misma diapositiva.\u003c/p>","aviso":"Ya terminó. \u003cstrong>Cierre esta pestaña\u003c/strong> y vuelva a la clase para seguir. La cápsula no guarda nada: puede repetirla cuando quiera."},"etiquetas":{"bien":"Bien visto","mal":"Mírelo otra vez","abierto":"Se puede defender"}};</script><script>
const D = window.__CAPSULA__;
const rail = document.getElementById('rail');
const zona = document.getElementById('zona');
let i = 0;

D.casos.forEach(() => rail.appendChild(document.createElement('span')));

function pintarRail() {
  [...rail.children].forEach((s, k) => {
    s.className = k < i ? 'hecho' : (k === i ? 'actual' : '');
  });
}

function caso() {
  pintarRail();
  const c = D.casos[i];
  zona.innerHTML = '';
  const cont = document.createElement('article');
  cont.className = 'caso';
  cont.innerHTML =
    '<p class="contador">Caso ' + (i + 1) + ' de ' + D.casos.length + '</p>' +
    '<p class="enunciado">' + c.enunciado + '</p>' +
    '<p class="pregunta">' + c.pregunta + '</p>';
  const ul = document.createElement('div');
  ul.className = 'opciones';
  const pie = document.createElement('div');
  pie.className = 'pie';
  const btn = document.createElement('button');
  btn.className = 'siguiente';
  btn.hidden = true;
  btn.textContent = i === D.casos.length - 1 ? 'Ver el cierre' : 'Siguiente caso';
  btn.addEventListener('click', () => { i++; i < D.casos.length ? caso() : cierre(); });
  pie.appendChild(btn);

  c.opciones.forEach((o) => {
    const b = document.createElement('button');
    b.className = 'opcion';
    b.type = 'button';
    b.dataset.tipo = o.tipo;
    b.textContent = o.t;
    b.addEventListener('click', () => {
      [...ul.querySelectorAll('.opcion')].forEach((x) => { x.disabled = true; });
      b.classList.add('elegida');
      const p = document.createElement('div');
      p.className = 'porque';
      p.dataset.tipo = o.tipo;
      p.setAttribute('role', 'status');
      const etiqueta = (D.etiquetas || {})[o.tipo] ||
        (o.tipo === 'bien' ? 'Alcanza' : (o.tipo === 'abierto' ? 'Se puede defender' : 'Se queda corto'));
      p.innerHTML = '<span class="marca">' + etiqueta + '</span>' + o.porque;
      b.insertAdjacentElement('afterend', p);
      if (c.nota) {
        const n = document.createElement('p');
        n.className = 'nota';
        n.innerHTML = c.nota;
        ul.appendChild(n);
      }
      btn.hidden = false;
      btn.focus();
    });
    ul.appendChild(b);
  });

  cont.appendChild(ul);
  cont.appendChild(pie);
  zona.appendChild(cont);
  zona.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function cierre() {
  [...rail.children].forEach((s) => { s.className = 'hecho'; });
  zona.innerHTML = '';
  const c = document.createElement('article');
  c.className = 'caso cierre';
  c.innerHTML = '<h2>' + D.cierre.titulo + '</h2>' + D.cierre.cuerpo +
    '<p class="aviso">' + D.cierre.aviso + '</p>';
  const r = document.createElement('button');
  r.className = 'reiniciar';
  r.type = 'button';
  r.textContent = 'Volver a empezar';
  r.addEventListener('click', () => { i = 0; caso(); });
  c.appendChild(r);
  zona.appendChild(c);
}

caso();
</script></body></html>
