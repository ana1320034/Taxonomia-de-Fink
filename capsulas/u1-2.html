<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Lo que se quedó afuera</title><style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --fondo:#0b1120; --superficie:#141c2e; --superficie-alta:#1b2438;
  --borde:#2b3650; --acento:#f2c314; --bien:#35b26b; --mal:#ef4444; --abierto:#60a5fa;
  --texto:#e8ecf4; --tenue:#96a0b8;
  --tipo:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;
}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--tipo);
  line-height:1.55;-webkit-font-smoothing:antialiased}
.rail{display:flex;gap:4px;padding:14px 20px 0;max-width:840px;margin:0 auto}
.rail span{flex:1;height:3px;border-radius:2px;background:var(--borde);transition:background .25s}
.rail span.hecho{background:var(--acento)}
.rail span.actual{background:var(--texto)}
.envoltura{max-width:840px;margin:0 auto;padding:20px 20px 56px}
header{padding:18px 0 8px;border-bottom:1px solid var(--borde);margin-bottom:24px}
h1{margin:0;font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:700;color:var(--acento);text-wrap:balance}
.entrada{margin:8px 0 0;color:var(--tenue);font-size:.95rem;max-width:62ch}
.contador{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tenue);
  font-variant-numeric:tabular-nums;margin-bottom:12px}
.caso{background:var(--superficie);border:1px solid var(--borde);border-radius:12px;padding:20px 22px}
.enunciado{margin:0;font-size:1.06rem;max-width:64ch}
.enunciado em{color:var(--acento);font-style:normal;font-weight:600}
.pregunta{margin:18px 0 0;font-weight:600;color:var(--texto);font-size:.98rem}
.opciones{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opcion{display:block;width:100%;text-align:left;font:inherit;font-size:.96rem;color:var(--texto);
  background:var(--superficie-alta);border:1px solid var(--borde);border-left:4px solid var(--borde);
  border-radius:9px;padding:13px 15px;cursor:pointer;transition:border-color .18s,background .18s}
.opcion:hover:not(:disabled){border-color:var(--acento)}
.opcion:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.opcion:disabled{cursor:default;opacity:.55}
.opcion.elegida{opacity:1;background:#1f2a42}
.opcion.elegida[data-tipo=bien]{border-left-color:var(--bien)}
.opcion.elegida[data-tipo=mal]{border-left-color:var(--mal)}
.opcion.elegida[data-tipo=abierto]{border-left-color:var(--abierto)}
.porque{margin:10px 0 0;padding:13px 15px;border-radius:9px;font-size:.93rem;
  background:#101a2e;border:1px solid var(--borde);border-left:4px solid var(--tenue);max-width:66ch}
.porque[data-tipo=bien]{border-left-color:var(--bien)}
.porque[data-tipo=mal]{border-left-color:var(--mal)}
.porque[data-tipo=abierto]{border-left-color:var(--abierto)}
.marca{display:block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:5px;color:var(--tenue)}
.porque[data-tipo=bien] .marca{color:var(--bien)}
.porque[data-tipo=mal] .marca{color:var(--mal)}
.porque[data-tipo=abierto] .marca{color:var(--abierto)}
.nota{margin:14px 0 0;font-size:.86rem;color:var(--tenue);border-left:2px solid var(--borde);padding-left:12px}
.pie{display:flex;justify-content:flex-end;margin-top:18px}
.siguiente{font:inherit;font-size:.95rem;font-weight:600;color:#0b1120;background:var(--acento);
  border:0;border-radius:8px;padding:11px 22px;cursor:pointer}
.siguiente:focus-visible{outline:2px solid var(--texto);outline-offset:2px}
.siguiente[hidden]{display:none}
.cierre h2{margin:0 0 10px;font-size:1.3rem;color:var(--acento)}
.cierre p{margin:0 0 12px;max-width:64ch}
.cierre .aviso{margin-top:22px;padding:14px 16px;border-radius:9px;background:#101a2e;
  border:1px solid var(--borde);border-left:4px solid var(--acento);font-size:.93rem}
.reiniciar{margin-top:16px;font:inherit;font-size:.9rem;color:var(--tenue);background:none;
  border:1px solid var(--borde);border-radius:8px;padding:9px 16px;cursor:pointer}
.reiniciar:hover{color:var(--texto);border-color:var(--tenue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.envoltura{padding:14px 14px 44px}.caso{padding:16px}}
</style><div class="rail" id="rail" aria-hidden="true"></div><div class="envoltura"><header><h1>Lo que se quedó afuera</h1><p class="entrada">Ocho intenciones de docentes reales, de distintas áreas. Decida, una por una, si caben en el lenguaje habitual de los resultados de aprendizaje.</p></header><main id="zona"></main></div><script>window.__CAPSULA__={"casos":[{"enunciado":"\u003cem>«Que sepan interpretar un estado financiero.»\u003c/em>","pregunta":"¿Cabe en un resultado de aprendizaje?","opciones":[{"t":"Se puede escribir como resultado de aprendizaje, sin perder nada.","tipo":"bien","porque":"Cabe entera. \u003cem>Interpreta\u003c/em> es un verbo observable y el objeto es claro. Este tipo de intención es la que el formato fue hecho para recoger."},{"t":"Se puede escribir, pero perdiendo lo esencial.","tipo":"mal","porque":"No se pierde nada aquí: interpretar un estado financiero es exactamente lo que se quiere y se puede observar."},{"t":"No cabe: no hay verbo para esto.","tipo":"mal","porque":"Sí hay verbo, y bueno. Esta es de las que pasan sin problema."}]},{"enunciado":"\u003cem>«Que dejen de tenerle miedo a los números.»\u003c/em>","pregunta":"¿Cabe en un resultado de aprendizaje?","opciones":[{"t":"Se puede escribir como resultado de aprendizaje, sin perder nada.","tipo":"mal","porque":"No hay manera de escribir el miedo con un verbo observable sin cambiar de tema."},{"t":"Se puede escribir, pero perdiendo lo esencial.","tipo":"bien","porque":"Exacto, y así es como se pierde. Termina convertida en \u003cem>«resuelve ejercicios de…»\u003c/em>, que no es lo mismo ni de lejos: se puede resolver ejercicios con miedo todos los días del semestre."},{"t":"No cabe: no hay verbo para esto.","tipo":"abierto","porque":"Es defendible: como está escrita no cabe. Pero en la práctica lo que ocurre es peor que descartarla — se traduce a un verbo cognitivo y se cree que quedó recogida."}]},{"enunciado":"\u003cem>«Que sepan trabajar con alguien que piensa distinto sin que sea un suplicio.»\u003c/em>","pregunta":"¿Cabe en un resultado de aprendizaje?","opciones":[{"t":"Se puede escribir como resultado de aprendizaje, sin perder nada.","tipo":"mal","porque":"No con las taxonomías cognitivas: lo que se pide aquí no es una operación mental sobre el contenido."},{"t":"Se puede escribir, pero perdiendo lo esencial.","tipo":"abierto","porque":"Se puede defender. Suele salir como \u003cem>«trabaja en equipo»\u003c/em>, que conserva la palabra y pierde el contenido: el problema no era trabajar en equipo, era hacerlo con quien piensa distinto."},{"t":"No cabe: no hay verbo para esto.","tipo":"bien","porque":"Con el lenguaje habitual, no. Esto es dimensión humana, y por eso se cae del documento. En el módulo 4 va a tener cómo escribirla."}]},{"enunciado":"\u003cem>«Que puedan diseñar una estructura que cumpla la norma.»\u003c/em>","pregunta":"¿Cabe en un resultado de aprendizaje?","opciones":[{"t":"Se puede escribir como resultado de aprendizaje, sin perder nada.","tipo":"bien","porque":"Cabe. \u003cem>Diseña\u003c/em> es observable y el criterio de cumplimiento es verificable. Otra de las que el formato recoge bien."},{"t":"Se puede escribir, pero perdiendo lo esencial.","tipo":"mal","porque":"No se pierde nada relevante: lo que se quería es exactamente lo que quedó escrito."},{"t":"No cabe: no hay verbo para esto.","tipo":"mal","porque":"Sí cabe, y sin dificultad."}]},{"enunciado":"\u003cem>«Que les importe la desigualdad, no solo que la sepan describir.»\u003c/em>","pregunta":"¿Cabe en un resultado de aprendizaje?","opciones":[{"t":"Se puede escribir como resultado de aprendizaje, sin perder nada.","tipo":"mal","porque":"No hay verbo observable para «que le importe». Cualquier intento cambia la intención."},{"t":"Se puede escribir, pero perdiendo lo esencial.","tipo":"abierto","porque":"Defendible: sale como \u003cem>«valora la importancia de…»\u003c/em>, una fórmula que aparece en miles de programas y que no significa nada verificable. Se conserva la palabra y se pierde la cosa."},{"t":"No cabe: no hay verbo para esto.","tipo":"bien","porque":"Con este lenguaje, no cabe. Es la clase de aprendizaje que Fink llama compromiso, y es probablemente la que más mueve a una docente a dar clase."}]},{"enunciado":"\u003cem>«Que sigan leyendo del tema cuando salgan de mi clase.»\u003c/em>","pregunta":"¿Cabe en un resultado de aprendizaje?","opciones":[{"t":"Se puede escribir como resultado de aprendizaje, sin perder nada.","tipo":"mal","porque":"Lo que ocurre después del curso no se puede observar dentro del curso, que es donde el formato mira."},{"t":"Se puede escribir, pero perdiendo lo esencial.","tipo":"abierto","porque":"Se puede sostener. Aparece como \u003cem>«fomenta el aprendizaje autónomo»\u003c/em>, que es tan general que no compromete a nada."},{"t":"No cabe: no hay verbo para esto.","tipo":"bien","porque":"Es aprender a aprender, y su rasgo incómodo es que solo se ve cuando el curso ya terminó. Por eso ninguna taxonomía cognitiva la recoge."}]},{"enunciado":"\u003cem>«Que se den cuenta de que son capaces de esto.»\u003c/em>","pregunta":"¿Cabe en un resultado de aprendizaje?","opciones":[{"t":"Se puede escribir como resultado de aprendizaje, sin perder nada.","tipo":"mal","porque":"No hay verbo. Y el objeto —lo que el estudiante descubre sobre sí mismo— está fuera de lo que el formato clasifica."},{"t":"Se puede escribir, pero perdiendo lo esencial.","tipo":"mal","porque":"Difícil de defender: no hay una versión de esto con verbo cognitivo que conserve algo. Simplemente desaparece."},{"t":"No cabe: no hay verbo para esto.","tipo":"bien","porque":"No cabe, y es una de las que más se repiten cuando se le pregunta a un docente qué quiere de verdad. Es dimensión humana en su forma más pura."}]},{"enunciado":"\u003cem>«Que conecten esto con lo que ven en las otras materias del semestre.»\u003c/em>","pregunta":"¿Cabe en un resultado de aprendizaje?","opciones":[{"t":"Se puede escribir como resultado de aprendizaje, sin perder nada.","tipo":"abierto","porque":"Se puede defender: \u003cem>relaciona\u003c/em> y \u003cem>conecta\u003c/em> son verbos aceptados. Pero fíjese en lo que pasa después: casi nadie los usa, porque el docente no controla las otras materias y le parece que no puede exigirlo."},{"t":"Se puede escribir, pero perdiendo lo esencial.","tipo":"abierto","porque":"También defendible. Suele quedar en \u003cem>«relaciona los contenidos del curso»\u003c/em> — hacia adentro, que es la versión cómoda y la más pobre de las tres direcciones posibles."},{"t":"No cabe: no hay verbo para esto.","tipo":"mal","porque":"Sí cabe: la integración es la única de las seis clases de Fink que tiene traducción cómoda al lenguaje habitual. El problema no es que no quepa, es que casi nunca se escribe."}],"nota":"Este es el caso fronterizo del conjunto. No todas las intenciones se caen del mismo modo."}],"cierre":{"titulo":"El colador no está roto","cuerpo":"\u003cp>De las ocho, dos pasan enteras y una pasa con esfuerzo. Las otras cinco se quedan arriba.\u003c/p>\u003cp>Y fíjese en cuáles se quedan: \u003cstrong>que les importe, que se conozcan trabajando, que pierdan el miedo, que sigan solos, que se den cuenta de lo que pueden\u003c/strong>. Casi siempre son las que un docente nombra primero cuando se le pregunta qué quiere de verdad.\u003c/p>\u003cp>No se cayeron porque a nadie se le ocurrieran. Se cayeron porque el colador solo dejaba pasar una clase de cosas.\u003c/p>","aviso":"Ya terminó. \u003cstrong>Cierre esta pestaña\u003c/strong> y vuelva a la clase para seguir. La cápsula no guarda nada: puede repetirla cuando quiera."}};</script><script>
const D = window.__CAPSULA__;
const rail = document.getElementById('rail');
const zona = document.getElementById('zona');
let i = 0;

D.casos.forEach(() => rail.appendChild(document.createElement('span')));

function pintarRail() {
  [...rail.children].forEach((s, k) => {
    s.className = k < i ? 'hecho' : (k === i ? 'actual' : '');
  });
}

function caso() {
  pintarRail();
  const c = D.casos[i];
  zona.innerHTML = '';
  const cont = document.createElement('article');
  cont.className = 'caso';
  cont.innerHTML =
    '<p class="contador">Caso ' + (i + 1) + ' de ' + D.casos.length + '</p>' +
    '<p class="enunciado">' + c.enunciado + '</p>' +
    '<p class="pregunta">' + c.pregunta + '</p>';
  const ul = document.createElement('div');
  ul.className = 'opciones';
  const pie = document.createElement('div');
  pie.className = 'pie';
  const btn = document.createElement('button');
  btn.className = 'siguiente';
  btn.hidden = true;
  btn.textContent = i === D.casos.length - 1 ? 'Ver el cierre' : 'Siguiente caso';
  btn.addEventListener('click', () => { i++; i < D.casos.length ? caso() : cierre(); });
  pie.appendChild(btn);

  c.opciones.forEach((o) => {
    const b = document.createElement('button');
    b.className = 'opcion';
    b.type = 'button';
    b.dataset.tipo = o.tipo;
    b.textContent = o.t;
    b.addEventListener('click', () => {
      [...ul.querySelectorAll('.opcion')].forEach((x) => { x.disabled = true; });
      b.classList.add('elegida');
      const p = document.createElement('div');
      p.className = 'porque';
      p.dataset.tipo = o.tipo;
      p.setAttribute('role', 'status');
      const etiqueta = o.tipo === 'bien' ? 'Alcanza' : (o.tipo === 'abierto' ? 'Se puede defender' : 'Se queda corto');
      p.innerHTML = '<span class="marca">' + etiqueta + '</span>' + o.porque;
      b.insertAdjacentElement('afterend', p);
      if (c.nota) {
        const n = document.createElement('p');
        n.className = 'nota';
        n.innerHTML = c.nota;
        ul.appendChild(n);
      }
      btn.hidden = false;
      btn.focus();
    });
    ul.appendChild(b);
  });

  cont.appendChild(ul);
  cont.appendChild(pie);
  zona.appendChild(cont);
  zona.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function cierre() {
  [...rail.children].forEach((s) => { s.className = 'hecho'; });
  zona.innerHTML = '';
  const c = document.createElement('article');
  c.className = 'caso cierre';
  c.innerHTML = '<h2>' + D.cierre.titulo + '</h2>' + D.cierre.cuerpo +
    '<p class="aviso">' + D.cierre.aviso + '</p>';
  const r = document.createElement('button');
  r.className = 'reiniciar';
  r.type = 'button';
  r.textContent = 'Volver a empezar';
  r.addEventListener('click', () => { i = 0; caso(); });
  c.appendChild(r);
  zona.appendChild(c);
}

caso();
</script></body></html>
