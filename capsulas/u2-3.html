<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>El rediseño que no llegó a marzo</title><style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --fondo:#0b1120; --superficie:#141c2e; --superficie-alta:#1b2438;
  --borde:#2b3650; --acento:#f2c314; --bien:#35b26b; --mal:#ef4444; --abierto:#60a5fa;
  --texto:#e8ecf4; --tenue:#96a0b8;
  --tipo:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;
}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--tipo);
  line-height:1.55;-webkit-font-smoothing:antialiased}
.rail{display:flex;gap:4px;padding:14px 20px 0;max-width:840px;margin:0 auto}
.rail span{flex:1;height:3px;border-radius:2px;background:var(--borde);transition:background .25s}
.rail span.hecho{background:var(--acento)}
.rail span.actual{background:var(--texto)}
.envoltura{max-width:840px;margin:0 auto;padding:20px 20px 56px}
header{padding:18px 0 8px;border-bottom:1px solid var(--borde);margin-bottom:24px}
h1{margin:0;font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:700;color:var(--acento);text-wrap:balance}
.entrada{margin:8px 0 0;color:var(--tenue);font-size:.95rem;max-width:62ch}
.contador{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tenue);
  font-variant-numeric:tabular-nums;margin-bottom:12px}
.caso{background:var(--superficie);border:1px solid var(--borde);border-radius:12px;padding:20px 22px}
.enunciado{margin:0;font-size:1.06rem;max-width:64ch}
.enunciado em{color:var(--acento);font-style:normal;font-weight:600}
.pregunta{margin:18px 0 0;font-weight:600;color:var(--texto);font-size:.98rem}
.opciones{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opcion{display:block;width:100%;text-align:left;font:inherit;font-size:.96rem;color:var(--texto);
  background:var(--superficie-alta);border:1px solid var(--borde);border-left:4px solid var(--borde);
  border-radius:9px;padding:13px 15px;cursor:pointer;transition:border-color .18s,background .18s}
.opcion:hover:not(:disabled){border-color:var(--acento)}
.opcion:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.opcion:disabled{cursor:default;opacity:.55}
.opcion.elegida{opacity:1;background:#1f2a42}
.opcion.elegida[data-tipo=bien]{border-left-color:var(--bien)}
.opcion.elegida[data-tipo=mal]{border-left-color:var(--mal)}
.opcion.elegida[data-tipo=abierto]{border-left-color:var(--abierto)}
.porque{margin:10px 0 0;padding:13px 15px;border-radius:9px;font-size:.93rem;
  background:#101a2e;border:1px solid var(--borde);border-left:4px solid var(--tenue);max-width:66ch}
.porque[data-tipo=bien]{border-left-color:var(--bien)}
.porque[data-tipo=mal]{border-left-color:var(--mal)}
.porque[data-tipo=abierto]{border-left-color:var(--abierto)}
.marca{display:block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:5px;color:var(--tenue)}
.porque[data-tipo=bien] .marca{color:var(--bien)}
.porque[data-tipo=mal] .marca{color:var(--mal)}
.porque[data-tipo=abierto] .marca{color:var(--abierto)}
.nota{margin:14px 0 0;font-size:.86rem;color:var(--tenue);border-left:2px solid var(--borde);padding-left:12px}
.pie{display:flex;justify-content:flex-end;margin-top:18px}
.siguiente{font:inherit;font-size:.95rem;font-weight:600;color:#0b1120;background:var(--acento);
  border:0;border-radius:8px;padding:11px 22px;cursor:pointer}
.siguiente:focus-visible{outline:2px solid var(--texto);outline-offset:2px}
.siguiente[hidden]{display:none}
.cierre h2{margin:0 0 10px;font-size:1.3rem;color:var(--acento)}
.cierre p{margin:0 0 12px;max-width:64ch}
.cierre .aviso{margin-top:22px;padding:14px 16px;border-radius:9px;background:#101a2e;
  border:1px solid var(--borde);border-left:4px solid var(--acento);font-size:.93rem}
.reiniciar{margin-top:16px;font:inherit;font-size:.9rem;color:var(--tenue);background:none;
  border:1px solid var(--borde);border-radius:8px;padding:9px 16px;cursor:pointer}
.reiniciar:hover{color:var(--texto);border-color:var(--tenue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.envoltura{padding:14px 14px 44px}.caso{padding:16px}}
</style><div class="rail" id="rail" aria-hidden="true"></div><div class="envoltura"><header><h1>El rediseño que no llegó a marzo</h1><p class="entrada">Cuatro docentes cuentan el rediseño que hicieron y por qué se les cayó. Identifique cuál de los cuatro ejes ignoraron.</p></header><main id="zona"></main></div><script>window.__CAPSULA__={"casos":[{"enunciado":"\u003cem>«Diseñé todo el curso alrededor de discusiones en pequeños grupos. En la primera clase me encontré con un auditorio de sillas atornilladas en filas y ciento diez estudiantes. Duré tres semanas intentándolo.»\u003c/em>","pregunta":"¿Qué eje quedó sin mirar?","opciones":[{"t":"El contexto: tiempo, espacio, tamaño","tipo":"bien","porque":"Sí. El espacio y el tamaño estaban decididos antes de que él escribiera una línea. Media hora mirando el aula asignada le habría ahorrado el semestre."},{"t":"Los estudiantes: lo que traen y lo que creen","tipo":"mal","porque":"No es este. Vuelva a leer el caso y pregúntese qué información habría evitado el problema."},{"t":"La materia: su naturaleza y su lugar en el plan","tipo":"mal","porque":"No es este. Vuelva a leer el caso y pregúntese qué información habría evitado el problema."},{"t":"Usted: lo que puede sostener","tipo":"mal","porque":"No: el docente sí sabía manejar discusiones. Lo que falló no fue su capacidad sino el sitio."}]},{"enunciado":"\u003cem>«Puse a los estudiantes a leer un artículo antes de cada clase y a traer tres preguntas. La primera semana lo hicieron seis. La segunda, dos. Terminé volviendo a explicar todo en clase.»\u003c/em>","pregunta":"¿Qué eje quedó sin mirar?","opciones":[{"t":"El contexto: tiempo, espacio, tamaño","tipo":"abierto","porque":"El tiempo puede estar de por medio —si trabajan, no hay horas—, pero eso también es información sobre los estudiantes, que es lo que no miró."},{"t":"Los estudiantes: lo que traen y lo que creen","tipo":"bien","porque":"Sí. No preguntó qué traen: si leen textos largos por su cuenta, si tienen las horas, si alguna vez alguien les enseñó a hacerlo. Y sin nada que devolver, la lectura no ocurre."},{"t":"La materia: su naturaleza y su lugar en el plan","tipo":"mal","porque":"No es este. Vuelva a leer el caso y pregúntese qué información habría evitado el problema."},{"t":"Usted: lo que puede sostener","tipo":"mal","porque":"No es este. Vuelva a leer el caso y pregúntese qué información habría evitado el problema."}]},{"enunciado":"\u003cem>«Armé el curso entero como proyecto integrador. Funcionó, pero a mitad de semestre me di cuenta de que los estudiantes no tenían los conceptos base para el proyecto: es una materia de segundo semestre.»\u003c/em>","pregunta":"¿Qué eje quedó sin mirar?","opciones":[{"t":"El contexto: tiempo, espacio, tamaño","tipo":"mal","porque":"No es este. Vuelva a leer el caso y pregúntese qué información habría evitado el problema."},{"t":"Los estudiantes: lo que traen y lo que creen","tipo":"abierto","porque":"Se toca con los estudiantes, porque el nivel es de ellos. Pero la raíz es dónde está la materia en el plan: en segundo semestre nadie trae esos conceptos."},{"t":"La materia: su naturaleza y su lugar en el plan","tipo":"bien","porque":"Sí. Una materia de segundo semestre tiene una responsabilidad distinta de una de octavo: primero hay que construir el suelo. El proyecto no estaba mal; estaba en el momento equivocado del plan."},{"t":"Usted: lo que puede sostener","tipo":"mal","porque":"No es este. Vuelva a leer el caso y pregúntese qué información habría evitado el problema."}]},{"enunciado":"\u003cem>«Cambié todo a debate abierto porque leí que era lo mejor. Odio los debates: nunca sé cuándo cortar, me incomoda el conflicto. Además tenía cinco asignaturas distintas ese semestre. Lo dejé en la semana cinco.»\u003c/em>","pregunta":"¿Qué eje quedó sin mirar?","opciones":[{"t":"El contexto: tiempo, espacio, tamaño","tipo":"abierto","porque":"Las cinco asignaturas son tiempo, sí — pero tiempo \u003cem>suyo\u003c/em>, que es el cuarto eje. El contexto es el del curso, no el de su carga laboral."},{"t":"Los estudiantes: lo que traen y lo que creen","tipo":"mal","porque":"No es este. Vuelva a leer el caso y pregúntese qué información habría evitado el problema."},{"t":"La materia: su naturaleza y su lugar en el plan","tipo":"mal","porque":"No es este. Vuelva a leer el caso y pregúntese qué información habría evitado el problema."},{"t":"Usted: lo que puede sostener","tipo":"bien","porque":"Sí, y son dos cosas del mismo eje: una metodología que le resulta incómoda cada martes, y cinco asignaturas a la vez. Ninguna de las dos se sostiene un semestre entero."}],"nota":"Este caso tiene dos cosas fallando a la vez, y las dos son del mismo eje."}],"cierre":{"titulo":"Media hora, cuatro ejes","cuerpo":"\u003cp>Ninguno de los cuatro rediseños era malo. Los cuatro se cayeron por \u003cstrong>una pregunta de treinta segundos que nadie hizo\u003c/strong>: cuántos son, qué traen, dónde está la materia en el plan, qué puede sostener usted.\u003c/p>\u003cp>Esa es toda la diferencia entre un rediseño que llega a marzo y uno que no.\u003c/p>","aviso":"Ya terminó. \u003cstrong>Cierre esta pestaña\u003c/strong> y vuelva a la clase para seguir. La cápsula no guarda nada: puede repetirla cuando quiera."},"etiquetas":{"bien":"Ese era","mal":"No fue ese","abierto":"También pesó"}};</script><script>
const D = window.__CAPSULA__;
const rail = document.getElementById('rail');
const zona = document.getElementById('zona');
let i = 0;

D.casos.forEach(() => rail.appendChild(document.createElement('span')));

function pintarRail() {
  [...rail.children].forEach((s, k) => {
    s.className = k < i ? 'hecho' : (k === i ? 'actual' : '');
  });
}

function caso() {
  pintarRail();
  const c = D.casos[i];
  zona.innerHTML = '';
  const cont = document.createElement('article');
  cont.className = 'caso';
  cont.innerHTML =
    '<p class="contador">Caso ' + (i + 1) + ' de ' + D.casos.length + '</p>' +
    '<p class="enunciado">' + c.enunciado + '</p>' +
    '<p class="pregunta">' + c.pregunta + '</p>';
  const ul = document.createElement('div');
  ul.className = 'opciones';
  const pie = document.createElement('div');
  pie.className = 'pie';
  const btn = document.createElement('button');
  btn.className = 'siguiente';
  btn.hidden = true;
  btn.textContent = i === D.casos.length - 1 ? 'Ver el cierre' : 'Siguiente caso';
  btn.addEventListener('click', () => { i++; i < D.casos.length ? caso() : cierre(); });
  pie.appendChild(btn);

  c.opciones.forEach((o) => {
    const b = document.createElement('button');
    b.className = 'opcion';
    b.type = 'button';
    b.dataset.tipo = o.tipo;
    b.textContent = o.t;
    b.addEventListener('click', () => {
      [...ul.querySelectorAll('.opcion')].forEach((x) => { x.disabled = true; });
      b.classList.add('elegida');
      const p = document.createElement('div');
      p.className = 'porque';
      p.dataset.tipo = o.tipo;
      p.setAttribute('role', 'status');
      const etiqueta = (D.etiquetas || {})[o.tipo] ||
        (o.tipo === 'bien' ? 'Alcanza' : (o.tipo === 'abierto' ? 'Se puede defender' : 'Se queda corto'));
      p.innerHTML = '<span class="marca">' + etiqueta + '</span>' + o.porque;
      b.insertAdjacentElement('afterend', p);
      if (c.nota) {
        const n = document.createElement('p');
        n.className = 'nota';
        n.innerHTML = c.nota;
        ul.appendChild(n);
      }
      btn.hidden = false;
      btn.focus();
    });
    ul.appendChild(b);
  });

  cont.appendChild(ul);
  cont.appendChild(pie);
  zona.appendChild(cont);
  zona.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function cierre() {
  [...rail.children].forEach((s) => { s.className = 'hecho'; });
  zona.innerHTML = '';
  const c = document.createElement('article');
  c.className = 'caso cierre';
  c.innerHTML = '<h2>' + D.cierre.titulo + '</h2>' + D.cierre.cuerpo +
    '<p class="aviso">' + D.cierre.aviso + '</p>';
  const r = document.createElement('button');
  r.className = 'reiniciar';
  r.type = 'button';
  r.textContent = 'Volver a empezar';
  r.addEventListener('click', () => { i = 0; caso(); });
  c.appendChild(r);
  zona.appendChild(c);
}

caso();
</script></body></html>
